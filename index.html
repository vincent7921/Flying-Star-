    /**
     * 依兩個星曜數字查表，取得該組合的解釋資料。
     * 規則：資料表 key 為「數字-數字」，且不保證兩種順序都有收錄，
     * 所以先查 a-b，查不到再查 b-a（互換查詢）。
     * @param {number} a
     * @param {number} b
     * @returns {object|null}
     */
    function lookupStarPair(a, b) {
      return starPairMeanings[`${a}-${b}`] || starPairMeanings[`${b}-${a}`] || null;
    }

    /* 九宮格內部座標 (r,c) 對應到外圍方位 key（中宮 (1,1) 無方位） */
    const cellToDirectionKey = {
      "0,0": "topLeft", "0,1": "top", "0,2": "topRight",
      "1,0": "left", "1,2": "right",
      "2,0": "bottomLeft", "2,1": "bottom", "2,2": "bottomRight"
    };



    /* ---------------- 九宮格（僅顯示，不做旋轉計算）----------------
       grid：宅命盤（固定資料，中文數字）
       periodGrid：大運盤
       annualGrid：流年盤
       monthGrid：流月盤
       dayGrid：流日盤
       hourGrid：流時盤
    ------------------------------------------------------------- */
    const NineGrid = {
      props: {
        grid: Array, periodGrid: Array, annualGrid: Array,
        monthGrid: Array, dayGrid: Array, hourGrid: Array,
        directions: Object, sitting: String, facing: String,
        selectedCell: Object,
        showDetailStars: {
          type: Boolean,
          default: true
        }
      },
      emits: ["select-cell"],
      setup(props) {
        const numToCn = { 1: "一", 2: "二", 3: "三", 4: "四", 5: "五", 6: "六", 7: "七", 8: "八", 9: "九" };
        const getStarColorClass = (val) => {
          const numMap = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
          const num = typeof val === 'number' ? val : (numMap[val] || parseInt(val, 10));
          if ([1, 4, 6, 8, 9].includes(num)) {
            return 'star-red';
          } else if ([2, 3, 5, 7].includes(num)) {
            return 'star-black';
          }
          return '';
        };
        /* 依格子座標取得對應方位文字（中宮回傳 null） */
        const dirLabel = (r, c) => {
          const key = cellToDirectionKey[`${r},${c}`];
          return key ? props.directions[key] : null;
        };
        /* 依方位文字判斷是否為座山／向山，回傳對應強調樣式 class */
        const dirClass = (r, c) => {
          const label = dirLabel(r, c);
          if (!label) return '';
          if (label === props.sitting) return 'is-sitting-dir';
          if (label === props.facing) return 'is-facing-dir';
          return '';
        };
        /* 依方位文字取得對應卦名／五行／人物意涵（中宮或無方位時回傳空字串） */
        const dirInfo = (r, c) => {
          const label = dirLabel(r, c);
          return label ? (baguaMap[label] || '') : '';
        };
        const { showDetailStars } = toRefs(props);
        return { numToCn, getStarColorClass, dirLabel, dirClass, dirInfo, showDetailStars };
      },
      template: `
    <div class="nine-grid">
      <template v-for="(row, r) in grid" :key="'r'+r">
        <div v-for="(ch, c) in row" :key="'c'+r+c"
             class="cell"
             :class="{ 'is-center': r===1 && c===1, 'is-selected': selectedCell && selectedCell.r===r && selectedCell.c===c }"
             @click="$emit('select-cell', { r, c })">
          <div v-if="dirLabel(r,c)" class="cell-dir-tag" :class="dirClass(r,c)">
            <span class="dir-tag-main">{{ dirLabel(r,c) }}</span>
            <span class="dir-tag-sub">{{ dirInfo(r,c) }}</span>
          </div>
          <div class="cell-row-header">
            <span>宅</span>
            <span>運</span>
            <span>流</span>
          </div>
          <div class="cell-row-value">
            <span :class="getStarColorClass(ch)">{{ ch }}</span>
            <span :class="getStarColorClass(periodGrid[r][c])">{{ numToCn[periodGrid[r][c]] }}</span>
            <span :class="getStarColorClass(annualGrid[r][c])">{{ annualGrid[r][c] }}</span>
          </div>
          <template v-if="showDetailStars">
            <div class="cell-row-divider"></div>
            <div class="cell-row-header">
              <span>月</span>
              <span>日</span>
              <span>時</span>
            </div>
            <div class="cell-row-value">
              <span :class="getStarColorClass(monthGrid[r][c])">{{ monthGrid[r][c] }}</span>
              <span :class="getStarColorClass(dayGrid[r][c])">{{ dayGrid[r][c] }}</span>
              <span :class="getStarColorClass(hourGrid[r][c])">{{ hourGrid[r][c] }}</span>
            </div>
          </template>
        </div>
      </template>
    </div>
  `
    };

    const FlyingStarChart = {
      components: { NineGrid },
      setup() {
        const activeKey = ref("south");
        const showSelector = ref(false);
        const showDetailStars = ref(true);
        const chart = computed(() => charts[activeKey.value]);

        /* 大運（1~9）目前選擇，預設九運 */
        const periodStar = ref(9);
        /* 依宅命盤 + 目前大運，動態算出大運盤 */
        const periodGrid = computed(() => generatePeriodChart(chart.value.grid, periodStar.value));

        /* 流年（西元年）目前選擇，預設當年度 */
        const activeYear = ref(currentYear);
        /* 依年份換算流年入中星 */
        const annualStar = computed(() => yearToAnnualStar(activeYear.value));
        /* 依宅命盤 + 流年入中星，動態算出流年盤 */
        const annualGrid = computed(() => generateAnnualChart(chart.value.grid, annualStar.value));

        /* 時間與四柱八字設定 */
        const now = new Date();
        const dateStr = ref(`${now.getFullYear()}-${padZero(now.getMonth() + 1)}-${padZero(now.getDate())}`);
        const shichenIndex = ref(Math.floor((((now.getHours() + 1) % 24)) / 2));

    // 同步日期／時辰變更到擇日神煞（十二建除、吉神、凶神）
    // Vue v-model 更新後觸發，確保神煞資料與畫面日期保持一致。
    watch([dateStr, shichenIndex], () => {
        setTimeout(() => {
            window.__qzRefreshDeities?.();
        }, 0);
    });

        const parsedDate = computed(() => {
          if (!dateStr.value) return { y: currentYear, m: 1, d: 1 };
          const [y, m, d] = dateStr.value.split('-').map(Number);
          return { y, m, d };
        });

        const hour = computed(() => SHICHEN[shichenIndex.value].hour);

        const siZhu = computed(() => {
          const { y, m, d } = parsedDate.value;
          if (!y || !m || !d) return null;
          return getSiZhu(y, m, d, hour.value, 0);
        });

        const yearStarInfo = computed(() => siZhu.value ? getYearStarInfo(siZhu.value.astroYear) : null);
        const monthStar = computed(() => siZhu.value ? getMonthStar(siZhu.value.year.z, siZhu.value.month.z) : null);
        const dayStarInfo = computed(() => {
          const { y, m, d } = parsedDate.value;
          if (!y || !m || !d) return null;
          return getDayStarInfo(y, m, d, hour.value, 0);
        });
        const hourStar = computed(() => {
          if (!siZhu.value || !dayStarInfo.value) return null;
          return getHourStar(dayStarInfo.value.dun, siZhu.value.day.z, siZhu.value.hour.z);
        });

        /* 動態計算流月、流日、流時飛星盤（隨座山旋轉） */
        const monthGrid = computed(() => monthStar.value ? generateFlyingStarChart(chart.value.grid, monthStar.value) : [[0, 0, 0], [0, 0, 0], [0, 0, 0]]);
        const dayGrid = computed(() => dayStarInfo.value ? generateFlyingStarChart(chart.value.grid, dayStarInfo.value.star) : [[0, 0, 0], [0, 0, 0], [0, 0, 0]]);
        const hourGrid = computed(() => hourStar.value ? generateFlyingStarChart(chart.value.grid, hourStar.value) : [[0, 0, 0], [0, 0, 0], [0, 0, 0]]);

        const setNow = () => {
          const curr = new Date();
          dateStr.value = `${curr.getFullYear()}-${padZero(curr.getMonth() + 1)}-${padZero(curr.getDate())}`;
          shichenIndex.value = Math.floor((((curr.getHours() + 1) % 24)) / 2);
        };

        // 日期上／下一日按鈕：直接改 dateStr（Vue 響應式賦值），
        // 不依賴任何原生 DOM 事件，桌機／手機都會確實觸發上面的 watch 同步神煞資料。
        const shiftDate = (delta) => {
          const [y, m, d] = dateStr.value.split('-').map(Number);
          const dt = new Date(y, (m || 1) - 1, d || 1);
          dt.setDate(dt.getDate() + delta);
          dateStr.value = `${dt.getFullYear()}-${padZero(dt.getMonth() + 1)}-${padZero(dt.getDate())}`;
        };

        /* 目前被點擊選取的宮位座標 { r, c }，關閉彈出視窗時為 null */
        const selectedCell = ref(null);
        const onSelectCell = (pos) => {
          // 點擊同一格：關閉；點擊不同格：切換到該格資料
          if (selectedCell.value && selectedCell.value.r === pos.r && selectedCell.value.c === pos.c) {
            selectedCell.value = null;
          } else {
            selectedCell.value = pos;
          }
        };
        const closePopup = () => { selectedCell.value = null; };

        /* 依目前選取的宮位，即時組出「宅命×大運」「大運×流年」「宅命×流年」查表結果 */
        const selectedInfo = computed(() => {
          if (!selectedCell.value) return null;
          const { r, c } = selectedCell.value;
          const isCenter = r === 1 && c === 1;

          const baseNum = cnToNum[chart.value.grid[r][c]];
          const periodNum = periodGrid.value[r][c];
          const annualNum = annualGrid.value[r][c];
          const monthNum = monthGrid.value[r][c];
          const dayNum = dayGrid.value[r][c];
          const hourNum = hourGrid.value[r][c];

          const dirKey = cellToDirectionKey[`${r},${c}`];
          const direction = isCenter ? null : chart.value.directions[dirKey];

          const pairs = [
            { label: "宅命 × 大運", a: baseNum, b: periodNum },
            { label: "大運 × 流年", a: periodNum, b: annualNum },
            { label: "宅命 × 流年", a: baseNum, b: annualNum }
          ].map((p) => ({ ...p, data: lookupStarPair(p.a, p.b) }));

          return { isCenter, direction, baseNum, periodNum, annualNum, monthNum, dayNum, hourNum, pairs };
        });

        const select = (key) => {
          activeKey.value = key;
          showSelector.value = false;
          selectedCell.value = null;
        };
        const selectPeriod = (p) => {
          periodStar.value = p;
        };
        const selectYear = (y) => {
          activeYear.value = y;
        };
        const toggleSelector = (e) => {
          e.stopPropagation();
          showSelector.value = !showSelector.value;
        };
        const closeSelector = () => {
          showSelector.value = false;
        };


        const initQzDeityIntegration = () => {
          const bridge = window.__qzDeityBridge;
          if (!bridge) return;
          const dateEl = document.getElementById('main-date-input');
          const hourEl = document.getElementById('main-hour-select');
          const ownerSave = document.getElementById('qz-owner-save');
          const modal = document.getElementById('qz-deity-modal');
          const closeModal = () => modal?.classList.remove('open');
          const ownerModal = document.getElementById('qz-owner-modal');
          const ownerModalOpenBtn = document.getElementById('qz-owner-modal-open');
          const ownerModalCancelBtn = document.getElementById('qz-owner-modal-cancel');
          const ownerModalCloseBtn = document.getElementById('qz-owner-modal-close');

          const ownerFieldIds = (n) => ({
            date: document.getElementById('qz-owner' + n + '-date'),
            time: document.getElementById('qz-owner' + n + '-time'),
            male: document.getElementById('qz-owner' + n + '-male'),
            female: document.getElementById('qz-owner' + n + '-female')
          });

          const getOwnerGender = (n) => {
            const f = ownerFieldIds(n);
            return f.male?.checked ? '男' : (f.female?.checked ? '女' : '');
          };

          const syncGenderVisual = (n) => {
            const f = ownerFieldIds(n);
            f.male?.closest('.qz-owner-gender-btn')?.classList.toggle('is-selected', !!f.male?.checked);
            f.female?.closest('.qz-owner-gender-btn')?.classList.toggle('is-selected', !!f.female?.checked);
          };

          const updateOwnerBaziDisplay = (n) => {
            const f = ownerFieldIds(n);
            const lunarEl = document.getElementById('qz-owner' + n + '-lunar');
            const yEl = document.getElementById('qz-owner' + n + '-pillar-year');
            const mEl = document.getElementById('qz-owner' + n + '-pillar-month');
            const dEl = document.getElementById('qz-owner' + n + '-pillar-day');
            const hEl = document.getElementById('qz-owner' + n + '-pillar-hour');
            if (!lunarEl) return;
            const dateVal = f.date?.value || '';
            const timeVal = f.time?.value || '';
            if (!dateVal || !timeVal) {
              lunarEl.textContent = '請輸入出生日期與時間';
              yEl.textContent = mEl.textContent = dEl.textContent = hEl.textContent = '－';
              return;
            }
            try {
              const [y, m, d] = dateVal.split('-').map(Number);
              const [hh, mi] = timeVal.split(':').map(Number);
              if (!y || !m || !d || Number.isNaN(hh) || Number.isNaN(mi)) throw new Error('invalid');
              const pillars = getSiZhu(y, m, d, hh, mi);
              let lunarText = '';
              if (typeof Solar !== 'undefined') {
                try { lunarText = Solar.fromYmdHms(y, m, d, hh, mi, 0).getLunar().toString(); } catch (e2) { lunarText = ''; }
              }
              lunarEl.textContent = lunarText || '（農曆換算引擎未載入）';
              yEl.textContent = pillars.year.label;
              mEl.textContent = pillars.month.label;
              dEl.textContent = pillars.day.label;
              hEl.textContent = pillars.hour.label;
            } catch (err) {
              lunarEl.textContent = '此出生時間無法換算，請檢查輸入';
              yEl.textContent = mEl.textContent = dEl.textContent = hEl.textContent = '－';
            }
          };

          const readOwnerSnapshot = () => {
            const snap = {};
            [1, 2].forEach(n => { snap['owner' + n] = { date: ownerFieldIds(n).date?.value || '', time: ownerFieldIds(n).time?.value || '', gender: getOwnerGender(n) }; });
            return snap;
          };

          const applyOwnerSnapshot = (snap) => {
            [1, 2].forEach(n => {
              const f = ownerFieldIds(n);
              const p = snap['owner' + n] || { date: '', time: '', gender: '' };
              if (f.date) f.date.value = p.date;
              if (f.time) f.time.value = p.time;
              if (f.male) f.male.checked = p.gender === '男';
              if (f.female) f.female.checked = p.gender === '女';
              syncGenderVisual(n);
              updateOwnerBaziDisplay(n);
            });
          };

          let ownerModalSnapshot = null;
          const closeOwnerModal = () => ownerModal?.classList.remove('open');
          const openOwnerModal = () => {
            ownerModalSnapshot = readOwnerSnapshot();
            [1, 2].forEach(n => { syncGenderVisual(n); updateOwnerBaziDisplay(n); });
            ownerModal?.classList.add('open');
          };
          const cancelOwnerModal = () => {
            if (ownerModalSnapshot) applyOwnerSnapshot(ownerModalSnapshot);
            closeOwnerModal();
          };

          ownerModalOpenBtn?.addEventListener('click', openOwnerModal);
          ownerModalCancelBtn?.addEventListener('click', cancelOwnerModal);
          ownerModalCloseBtn?.addEventListener('click', cancelOwnerModal);
          ownerModal?.addEventListener('click', e => { if (e.target === ownerModal) cancelOwnerModal(); });

          [1, 2].forEach(n => {
            const f = ownerFieldIds(n);
            f.date?.addEventListener('change', () => updateOwnerBaziDisplay(n));
            f.date?.addEventListener('input', () => updateOwnerBaziDisplay(n));
            f.time?.addEventListener('change', () => updateOwnerBaziDisplay(n));
            f.time?.addEventListener('input', () => updateOwnerBaziDisplay(n));
            f.male?.addEventListener('change', () => syncGenderVisual(n));
            f.female?.addEventListener('change', () => syncGenderVisual(n));
            document.getElementById('qz-owner' + n + '-clear-btn')?.addEventListener('click', () => {
              if (f.date) f.date.value = '';
              if (f.time) f.time.value = '';
              if (f.male) f.male.checked = false;
              if (f.female) f.female.checked = false;
              syncGenderVisual(n);
              updateOwnerBaziDisplay(n);
            });
          });

          const sync = () => {
            const owners = {
              owner1: {
                date: document.getElementById('qz-owner1-date')?.value || '',
                time: document.getElementById('qz-owner1-time')?.value || '',
                gender: getOwnerGender(1)
              },

                date: document.getElementById('qz-owner2-date')?.value || '',
                time: document.getElementById('qz-owner2-time')?.value || '',
                gender: getOwnerGender(2)
              }
            };
            const snapshot = bridge.refresh(dateEl?.value, hourEl?.value, owners);
            renderQzDeities(snapshot, bridge, modal);
          };
          


          window.__qzRefreshDeities = sync;
          dateEl?.addEventListener('change', () => setTimeout(sync, 0));
          hourEl?.addEventListener('change', () => setTimeout(sync, 0));
          ownerSave?.addEventListener('click', () => { sync(); ownerModalSnapshot = null; closeOwnerModal(); });
          document.getElementById('qz-modal-close')?.addEventListener('click', closeModal);
          modal?.addEventListener('click', e => { if (e.target === modal) closeModal(); });

          // 初始帶入求真原本儲存的命主資料。
          const stored = (() => { try { return JSON.parse(localStorage.getItem('huangli-owner-profiles-v1') || '{}'); } catch(e) { return {}; } })();
          for (const n of [1,2]) {
            const p = stored['owner'+n] || {};
            document.getElementById(`qz-owner${n}-date`).value = p.date || '';
            document.getElementById(`qz-owner${n}-time`).value = p.time || '';
            document.getElementById(`qz-owner${n}-${p.gender === '女' ? 'female' : 'male'}`).checked = !!p.gender;
            syncGenderVisual(n);
            updateOwnerBaziDisplay(n);
          }
          sync();
        };

        const renderQzDeities = (snapshot, bridge, modal) => {
          const render = (id, items, kind) => {
            const box = document.getElementById(id); if (!box) return;
            box.innerHTML = '';
            if (!items.length) {
              const empty = document.createElement('span'); empty.style.cssText='color:#a0b0ff;font-style:italic;';
              empty.textContent = kind === 'good' ? '本日暫無吉神' : (kind === 'bad' ? '本日暫無需特別注意的凶神' : '此日期暫無可用資料');
              box.appendChild(empty); return;
            }
            items.forEach(item => {
              const btn = document.createElement('button');
              btn.type='button';
              btn.textContent=item.name;
              btn.className='qz-deity-btn qz-ranked';
              if (kind==='jianchu') btn.classList.add('qz-jianchu');
              else {
                const grade = /deity-grade-([abc])/i.exec(item.className)?.[1] || 'c';
                btn.classList.add(item.nature==='吉'?'qz-nature-good':'qz-nature-bad','qz-grade-'+grade);
                if (item.className.includes('personal-')) btn.classList.add('qz-personal');
                if (item.accent) btn.style.setProperty('--deity-accent',item.accent);
                if (item.background) btn.style.setProperty('--deity-bg',item.background);
              }
