<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紫白飛星九宮圖</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <style>
    /* 全域 CSS 變數：設定主要的配色系統與字體族群，方便統一修改 */
    :root {
      --ink: #2b2620;
      /* 深墨色：用於一般文字及九宮格數字 */
      --ink-soft: #533812;
      /* 淺墨色：用於次要的說明文字 */
      --paper: #f3ead6;
      /* 紙張底色：網頁與九宮格的主要淺金黃底色 */
      --paper-deep: #e7d9b8;
      /* 深紙色：用於九宮格中心（中宮）的背景色 */
      --paper-line: #cdbb92;
      /* 紙張格線色：九宮格內部的細線顏色 */
      --cinnabar: #d80b0f;
      /* 朱砂紅：用於座山文字、中宮文字、啟用的按鈕等強調色 */
      --cinnabar-deep: #d80b0f;
      /* 深朱砂紅：用於漸層底線或深色朱砂強調 */
      --brass: #b6924f;
      /* 黃銅色：用於外框線與按鈕懸停邊框色 */
      --brass-soft: #d8c290;
      /* 淺黃銅色：用於裝飾性的文字或邊框 */
      --purple: #8a6bb5;
      /* 紫（呼應「紫白飛星」）：用於流年星的強調色，與大運星（朱砂紅）、宅命星（墨色）區隔 */
      --indigo: #5b6bab;
      /* 靛藍：僅用於五行生剋圖中的數字分組配色，與流年紫、大運紅區隔，避免語意混淆 */
      --bg: #14110d;
      /* 網頁主背景色（極深褐色） */
      --bg-vignette: #1d1811;
      /* 網頁主背景的漸層中心色 */
      --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", "STSong", serif;
      /* 標題與飛星數字使用的明體/宋體字型 */
      --font-ui: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 一般 UI 介面與按鈕使用的無襯線字型 */
    }

    /* 基本重設：確保所有元素的外距、內距計算方式一致 */
    * {
      box-sizing: border-box;
    }

    /* 網頁整體版面與背景設定 */
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      /* 徑向漸層背景，營造古典莊嚴的暗色調氛圍 */
      background:
        radial-gradient(ellipse at 50% -10%, var(--bg-vignette) 0%, var(--bg) 60%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px 72px;
      /* 網頁四周的間距 */
    }

    /* Vue 掛載點容器 */
    #app {
      width: 100%;
    }

    /* 應用程式主舞台：限制最大寬度並置中 */
    .stage {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
    }

    /* ---------- 電腦版版面：左側設定＋資訊卡片／右側九宮格 ---------- */
    /* 手機／平板（< 1080px）維持原本單欄由上到下排列，不受影響。 */
    @media (min-width: 1080px) {
      body {
        align-items: center;
        padding: 24px 24px;
      }

      .stage {
        max-width: 1500px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 36px;
      }

      .stage-left {
        flex: 1 1 640px;
        min-width: 480px;
        max-width: 720px;
      }

      .stage-right {
        flex: 0 1 550px;
        min-width: 340px;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .stage-right .grid-wrap {
        max-width: 520px;
      }

      .stage-right .sitting-control {
        margin: 14px auto 0;
      }

      .stage-right .footnote {
        margin-top: 10px;
      }

      /* 左側元件壓縮間距／字級，讓設定選項、四柱八字、擇日神煞盡量在一屏內顯示完畢 */
      .stage-left .header {
        margin-bottom: 8px;
        text-align: left;
      }

      .stage-left .control-row {
        justify-content: flex-start;
        margin: 0 0 8px;
      }

      .stage-left .control-note {
        margin: 0 0 10px;
        text-align: left;
      }

      .stage-left .sizhu-panel {
        max-width: none;
        width: 100%;
        margin: 0 0 10px;
        padding: 10px 12px;
      }

      .stage-left .sizhu-title {
        margin-bottom: 8px;
      }

      .stage-left .sizhu-row {
        gap: 6px;
      }

      .stage-left .sizhu-card {
        padding: 5px 3px;
      }

      .stage-left .sizhu-card .gz {
        font-size: 16px;
        margin-top: 2px;
      }

      .stage-left .sizhu-meta {
        margin-top: 8px;
        padding-top: 8px;
        gap: 4px 10px;
        font-size: 10.5px;
        justify-content: flex-start;
      }

      .stage-left .qz-integrated-panel {
        max-width: none;
        width: 100%;
        margin: 0;
        padding: 10px 12px;
      }

      .stage-left .qz-integrated-title {
        margin-bottom: 8px;
        text-align: left;
      }

      .stage-left .qz-integrated-section {
        min-height: 24px;
      }

      .stage-left .qz-integrated-section+.qz-integrated-section {
        margin-top: 5px;
        padding-top: 5px;
      }

      .stage-left .qz-owner-trigger-row {
        justify-content: flex-start;
      }
    }

    /* ---------- 上方標題區 ---------- */
    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    /* 標題上方的小字裝飾 */
    .eyebrow {
      font-family: var(--font-ui);
      font-size: 11px;
      /* 字體大小 */
      letter-spacing: 0.35em;
      /* 字距 */
      color: var(--brass-soft);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* 主標題：紫白飛星九宮圖 */
    .title {
      font-family: var(--font-display);
      font-size: 26px;
      /* 字體大小 */
      font-weight: 600;
      color: var(--paper);
      letter-spacing: 0.14em;
      margin: 0;
    }

    /* 副標題 */
    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      /* 字體大小 */
      color: #a89a7d;
      letter-spacing: 0.08em;
    }

    /* ---------- 九宮格外層包裝 ---------- */
    /* 九宮格外圍包裝器：維持 1:1 的正方形比例。八方位已改為內嵌於九宮格四角／四邊格內的小標籤，
       不再另闢外圈，行動裝置上可讓九宮格使用完整寬度，避免外圈方位被壓縮的問題。 */
    .grid-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1/1;
      margin: 0 auto;
    }

    /* ---------- 中間九宮格主體 ---------- */
    .nine-grid {
      width: 100%;
      height: 100%;
      aspect-ratio: 1/1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      /* 均分 3 欄 */
      grid-template-rows: repeat(3, 1fr);
      /* 均分 3 列 */
      background: var(--paper);
      border: 1.5px solid var(--brass);
      /* 黃銅色外邊框 */
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .65), inset 0 0 0 1px rgba(0, 0, 0, .04);
      position: relative;
    }

    /* 將紅線融入九宮格底部的座山方向邊框（使用 CSS 偽元素實現漸層紅線） */
    .nine-grid::after {
      content: '';
      position: absolute;
      bottom: -3px;
      /* 貼合在底邊框上 */
      left: -1.5px;
      right: -1.5px;
      height: 8px;
      /* 紅線粗細 */
      background: linear-gradient(90deg, transparent, var(--cinnabar) 15%, var(--cinnabar-deep) 50%, var(--cinnabar) 85%, transparent);
      border-radius: 2px;
      pointer-events: none;
    }

    /* ---------- 四柱八字卡片區 ---------- */
    .sizhu-panel {
      width: 100%;
      background: #1c1812;
      border: 1px solid var(--brass);
      border-radius: 6px;
      padding: 16px;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      max-width: 520px;
    }

    .sizhu-title {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--brass-soft);
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      text-align: center;
    }

    .sizhu-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .sizhu-card {
      text-align: center;
      border: 1px solid #3a3327;
      border-radius: 5px;
      padding: 8px 4px;
      background: #120f0b;
    }

    .sizhu-card .role {
      font-size: 11px;
      color: #a89a7d;
      letter-spacing: 0.15em;
    }

    .sizhu-card .gz {
      font-family: var(--font-display);
      font-size: 20px;
      margin-top: 4px;
      letter-spacing: 0.1em;
      color: var(--paper);
      font-weight: 700;
    }

    .sizhu-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-top: 12px;
      font-size: 12px;
      color: #a89a7d;
      justify-content: center;
      border-top: 1px dashed #3a3327;
      padding-top: 10px;
    }

    .sizhu-meta b {
      color: var(--brass-soft);
    }

    /* ---------- 建除／吉神／凶神／命主整合區 ---------- */
    .qz-integrated-panel {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 20px;
      background: #1c1812;
      border: 1px solid var(--brass);
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .qz-integrated-title {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--brass-soft);
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      text-align: center;
    }

    .qz-integrated-section {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 30px;
    }

    .qz-integrated-section + .qz-integrated-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #3a3327;
    }

    .qz-integrated-label {
      flex: 0 0 auto;
      font-family: var(--font-ui);
      font-size: 12px;
      line-height: 28px;
      color: #a89a7d;
      text-align: left;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .qz-integrated-buttons {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 5px;
      min-width: 0;
    }

    /* 只調整容器，不改動吉神／凶神按鈕本身的顏色與等級規則。 */
    .qz-integrated-buttons .qz-deity-btn {
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 5px;
    }

    /* 觸發「設定命主資料」彈跳視窗的按鈕列 */
    .qz-owner-trigger-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #3a3327;
      display: flex;
      justify-content: center;
    }

    .qz-owner-trigger-row .now-btn {
      border-color: var(--brass);
      color: var(--brass-soft);
    }

    .qz-owner-trigger-row .now-btn:hover {
      background: var(--brass);
      color: #120f0b;
    }

    /* 命主資料設定彈跳視窗（雙欄命主卡片：出生資料＋農曆／四柱八字） */
    .qz-owner-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 5, 0.68);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10000;
    }

    .qz-owner-modal-backdrop.open {
      display: flex;
    }

    .qz-owner-modal-window {
      position: relative;
      width: 100%;
      max-width: 780px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid var(--brass);
      border-radius: 6px;
      box-shadow: 0 24px 70px -14px rgba(0, 0, 0, .75);
      overflow: hidden;
    }

    .qz-owner-modal-close {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 28px;
      height: 28px;
      border: 1px solid var(--paper-line);
      background: transparent;
      color: var(--ink-soft);
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
      z-index: 2;
    }

    .qz-owner-modal-close:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fbeee0;
    }

    .qz-owner-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow-y: auto;
      flex: 1 1 auto;
    }

    .qz-owner-card {
      padding: 20px 20px 24px;
      border-top: 3px solid transparent;
    }

    .qz-owner-card+.qz-owner-card {
      border-left: 1px dashed var(--paper-line);
    }


    .qz-owner-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .qz-owner-card-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.05em;
    }

    .qz-owner-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(182, 146, 79, 0.15);
      color: var(--brass);
      font-size: 12px;
      font-family: var(--font-ui);
      border: 1px solid var(--paper-line);
    }

    .qz-owner-card-2 .qz-owner-badge {
      background: rgba(216, 11, 15, 0.1);
      color: var(--cinnabar);
    }

    .qz-owner-delete-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--paper-line);
      background: transparent;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s ease;
      margin-right:15px;
    }

    .qz-owner-delete-btn:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fbeee0;
    }

    .qz-owner-delete-btn svg {
      width: 14px;
      height: 14px;
    }

    .qz-owner-field {
      margin-bottom: 14px;
    }

    .qz-owner-field label {
      display: block;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .qz-owner-input {
      width: 100%;
      box-sizing: border-box;
      font-family: var(--font-display);
      font-size: 14px;
      padding: 9px 10px;
      border-radius: 4px;
      border: 1px solid var(--paper-line);
      background-color: #fff;
      color: var(--ink);
      color-scheme: light;
      cursor: pointer;
    }

    .qz-owner-input:focus {
      outline: none;
      border-color: var(--brass);
    }

    .qz-owner-gender-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .qz-owner-gender-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 0;
      border-radius: 4px;
      border: 1px solid var(--paper-line);
      background-color: #fff;
      color: var(--ink-soft);
      font-family: var(--font-ui);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .qz-owner-gender-btn input {
      display: none;
    }

    .qz-owner-gender-btn.is-selected {
      background: rgba(182, 146, 79, 0.18);
      border-color: var(--brass);
      color: var(--ink);
    }

    .qz-owner-bazi {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--paper-line);
    }

    .qz-owner-lunar-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      font-family: var(--font-ui);
      font-size: 12.5px;
    }

    .qz-owner-lunar-label {
      font-weight: 600;
      color: var(--brass);
      white-space: nowrap;
      letter-spacing: 0.06em;
    }

    .qz-owner-lunar-value {
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .qz-owner-pillar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .qz-owner-pillar-card {
      text-align: center;
      border: 1px solid var(--paper-line);
      border-radius: 5px;
      padding: 7px 3px;
      background: var(--paper-deep);
    }

    .qz-owner-pillar-role {
      font-size: 10.5px;
      color: var(--ink-soft);
      letter-spacing: 0.1em;
    }

    .qz-owner-pillar-gz {
      font-family: var(--font-display);
      font-size: 16px;
      margin-top: 3px;
      letter-spacing: 0.05em;
      color: var(--ink);
      font-weight: 700;
    }

    .qz-owner-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--paper-line);
      background: rgba(0, 0, 0, 0.03);
    }

    .qz-owner-btn-cancel,
    .qz-owner-btn-save {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 12.5px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all .15s ease;
      border: 1px solid var(--paper-line);
      background: transparent;
    }

    .qz-owner-btn-cancel {
      color: var(--ink-soft);
    }

    .qz-owner-btn-cancel:hover {
      border-color: var(--brass);
      color: var(--ink);
    }

    .qz-owner-btn-save {
      border-color: var(--cinnabar);
      color: var(--cinnabar);
    }

    .qz-owner-btn-save:hover {
      background: var(--cinnabar);
      color: #fff8ec;
    }

    .qz-owner-btn-save svg {
      width: 13px;
      height: 13px;
    }

    @media (max-width: 720px) {
      .qz-owner-cards {
        grid-template-columns: 1fr;
      }

      .qz-owner-card+.qz-owner-card {
        border-left: none;
        border-top: 1px dashed var(--paper-line);
      }
    }

    /* 九宮格單個宮位單元格：同時顯示「宅命星、大運星、流年星」與「流月星、流日星、流時星」 */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0px;
      border: 0.5px solid var(--paper-line);
      /* 宮位間的分隔細線 */
      background: var(--paper);
      position: relative;
      aspect-ratio: 1/1;
      padding: 2px 1px;
    }

    .cell-row-header,
    .cell-row-value {
      display: flex;
      justify-content: space-around;
      width: 100%;
      padding: 0 1px;
    }

    .cell-row-header {
      font-family: var(--font-ui);
      font-size: clamp(7.5px, 1.3vw, 9.5px);
      color: var(--ink-soft);
      letter-spacing: 0.01em;
      opacity: 0.85;
    }

    .cell-row-value {
      font-family: var(--font-display);
      font-size: clamp(12px, 2.6vw, 17px);
      font-weight: 700;
      line-height: 1.05;
    }

    /* 宅運流與月日時之間的精緻分隔線 */
    .cell-row-divider {
      width: 86%;
      height: 1px;
      margin: 3px 0;
      border-top: 1px dashed var(--paper-line);
      opacity: 0.7;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .cell-row-header span,
    .cell-row-value span {
      width: 33%;
      text-align: center;
    }

    .star-red {
      color: var(--cinnabar) !important;
    }

    .star-black {
      color: var(--ink) !important;
    }

    .date-input {
      font-family: var(--font-display);
      font-size: 13px;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #4a4130;
      background-color: #120f0b;
      color: var(--paper);
      color-scheme: dark;
      cursor: pointer;
      min-height: 31px;
    }

    .date-input::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.8);
    }

    .date-input:focus {
      outline: none;
      border-color: var(--brass);
    }

    .date-input-wrap {
      display: inline-flex;
      align-items: stretch;
      vertical-align: middle;
    }

    .date-input-wrap .date-input {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: none;
    }

    .date-stepper {
      display: flex;
      flex-direction: column;
      border: 1px solid #4a4130;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
      overflow: hidden;
      min-height: 31px;
    }

    .date-step-btn {
      flex: 1;
      min-width: 26px;
      border: none;
      background-color: #120f0b;
      color: var(--paper);
      cursor: pointer;
      font-size: 9px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .date-step-btn:first-child {
      border-bottom: 1px solid #4a4130;
    }

    .date-step-btn:hover,
    .date-step-btn:active {
      background: var(--cinnabar);
      color: #fff8ec;
    }

    .now-btn {
      padding: 5px 12px;
      border: 1px solid var(--cinnabar);
      color: var(--cinnabar);
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 12.5px;
      letter-spacing: 0.05em;
      transition: all .15s;
    }

    .now-btn:hover {
      background: var(--cinnabar);
      color: #fff8ec;
    }

    /* 內嵌於九宮格四角／四邊格的方位小標籤：取代原先九宮格外圍的八方位環，
       讓九宮格能佔滿版面寬度，同時仍可辨識每一宮所對應的方位與其卦名／五行／人物意涵。
       中性方位＝黃銅灰（低調不搶眼）；座山方位＝朱砂紅（呼應座山選擇按鈕）；向山方位＝靛藍（呼應五行生剋圖的配色）。
       方位字與卦名資訊採同一字級，僅以「主／次」透明度區分主從，並排呈現、必要時自動換行，避免截斷影響辨讀。 */
    .cell-dir-tag {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      padding: 0 3px;
      line-height: 1.5;
      margin-bottom: 10px;
      text-align: center;
      pointer-events: none;
    }

    .cell-dir-tag .dir-tag-main {
      font-family: var(--font-ui);
      font-size: clamp(12px, 2vw, 16px);
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      opacity: .62;
      font-weight: 700;
    }

    .cell-dir-tag .dir-tag-sub {
      font-family: var(--font-ui);
      font-size: clamp(9px, 2vw, 13px);
      letter-spacing: 0.02em;
      color: var(--ink-soft);
      opacity: .42;
    }

    .cell-dir-tag.is-sitting-dir .dir-tag-main,
    .cell-dir-tag.is-sitting-dir .dir-tag-sub {
      color: var(--cinnabar);
    }

    .cell-dir-tag.is-sitting-dir .dir-tag-main {
      opacity: 1;
    }

    .cell-dir-tag.is-sitting-dir .dir-tag-sub {
      opacity: .8;
    }

    .cell-dir-tag.is-facing-dir .dir-tag-main,
    .cell-dir-tag.is-facing-dir .dir-tag-sub {
      color: var(--indigo);
    }

    .cell-dir-tag.is-facing-dir .dir-tag-main {
      opacity: 1;
    }

    .cell-dir-tag.is-facing-dir .dir-tag-sub {
      opacity: .8;
    }

    /* ---------- 大運／流年 下拉選單列 ---------- */
    /* 原先各 9 顆按鈕的選擇列改為兩個下拉選單並排，行動裝置上大幅節省空間 */
    .control-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 auto 14px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 6px 14px;
      border: 1px solid #3a3327;
      border-radius: 5px;
      background: #1c1812;
    }

    .control-label {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--brass-soft);
      white-space: nowrap;
    }

    /* 切換開關 (Toggle Switch) 樣式 */
    .switch-group {
      padding: 6px 12px;
      user-select: none;
    }

    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .switch-label input {
      display: none;
    }

    .switch-slider {
      position: relative;
      width: 34px;
      height: 18px;
      background-color: #120f0b;
      border: 1px solid #4a4130;
      border-radius: 9px;
      transition: background-color .2s ease, border-color .2s ease;
    }

    .switch-slider::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 2px;
      top: 2px;
      background-color: var(--brass-soft);
      border-radius: 50%;
      transition: transform .2s ease, background-color .2s ease;
    }

    .switch-label input:checked+.switch-slider {
      background-color: rgba(182, 146, 79, 0.25);
      border-color: var(--brass);
    }

    .switch-label input:checked+.switch-slider::before {
      transform: translateX(16px);
      background-color: var(--paper);
    }

    .switch-text {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.05em;
      color: var(--paper-deep);
    }

    /* 自訂下拉選單外觀：移除瀏覽器預設樣式，改用統一的黃銅色系與自繪箭頭 */
    .control-select {
      appearance: none;
      -webkit-appearance: none;
      font-family: var(--font-display);
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 6px 26px 6px 10px;
      border-radius: 4px;
      border: 1px solid #4a4130;
      background-color: #120f0b;
      color: var(--paper);
      cursor: pointer;
      transition: border-color .18s ease, box-shadow .18s ease;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23d8c290' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 9px center;
    }

    .control-select:hover {
      border-color: var(--brass);
    }

    .control-select:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 2px rgba(182, 146, 79, 0.25);
    }

    #period-select {
      color: var(--cinnabar);
      border-color: rgba(216, 11, 15, 0.4);
    }

    #year-select {
      color: var(--purple);
      border-color: rgba(138, 107, 181, 0.4);
    }

    /* 大運／流年入中說明文字（合併為單行，中間以圓點分隔） */
    .control-note {
      display:none;
      text-align: center;
      font-size: 12.5px;
      color: var(--brass-soft);
      letter-spacing: 0.06em;
      margin: 0 auto 20px;
    }

    .control-note .accent {
      color: var(--cinnabar);
      font-weight: 700;
    }

    .control-note .accent-purple {
      color: var(--purple);
      font-weight: 700;
    }

    .control-note .sep {
      margin: 0 8px;
      opacity: .4;
    }

    /* ---------- 座山選擇（獨立於九宮格之外的按鈕＋彈出選單） ---------- */
    /* 按鈕本身置於九宮格下方，方便手機單手操作（拇指容易觸及畫面下半部） */
    .sitting-control {
      display: flex;
      justify-content: center;
      margin: 18px auto 0;
    }

    .sitting-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: 0.06em;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px dashed rgba(216, 11, 15, 0.4);
      background: rgba(216, 11, 15, 0.08);
      color: var(--cinnabar);
      cursor: pointer;
      transition: all .2s ease;
    }

    .sitting-btn:hover {
      background: rgba(216, 11, 15, 0.15);
      border-style: solid;
      box-shadow: 0 0 8px rgba(216, 11, 15, 0.25);
    }

    .sitting-btn .chevron {
      font-size: 11px;
      opacity: .7;
      transition: transform .2s ease;
    }

    .sitting-btn[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    /* 座山選擇面板改為「置中彈出視窗」（與宮位資訊彈窗同一套互動模式），
       不論按鈕在畫面何處，選單一律浮在畫面正中央，不用捲動畫面就能點選，
       行動裝置上拇指也能一次完成「開啟→選擇」。 */
    .sitting-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 5, 0.68);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .sitting-modal-window {
      position: relative;
      width: 100%;
      max-width: 260px;
      background: #1c1812;
      border: 1px solid var(--brass);
      border-radius: 8px;
      padding: 20px 16px 16px;
      box-shadow: 0 24px 70px -14px rgba(0, 0, 0, .75);
    }

    .sitting-modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid #3a3327;
      background: transparent;
      color: var(--brass-soft);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
    }

    .sitting-modal-close:hover {
      border-color: var(--brass);
      color: var(--paper);
    }

    /* 圖例（三顆星的顏色說明） */
    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin: 18px auto 0;
      font-size: 11.5px;
      color: #a89a7d;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.dot-red {
      background: var(--cinnabar);
    }

    .legend-dot.dot-black {
      background: var(--ink);
    }

    /* 宮位滑鼠移入／點擊選取效果 */
    .cell {
      cursor: pointer;
      transition: background .15s ease, box-shadow .15s ease;
    }

    .cell:hover,
    .cell.is-selected {
      background: #ecdfc0;
      box-shadow: inset 0 0 0 1.5px var(--brass);
    }

    .cell.is-center:hover,
    .cell.is-center.is-selected {
      background: #ddc9a0;
    }

    .cell.is-selected {
      box-shadow: inset 0 0 0 2px var(--cinnabar);
    }

    /* 點擊提示文字 */
    .click-hint {
      text-align: center;
      max-width: 560px;
      margin: 22px auto 0;
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    /* ---------- 宮位資訊彈出視窗（星曜組合解釋） ---------- */
    .popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 5, 0.68);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .popup-window {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 82vh;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--brass);
      border-radius: 6px;
      padding: 24px 24px 18px;
      box-shadow: 0 24px 70px -14px rgba(0, 0, 0, .75);
    }

    .popup-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--paper-line);
      background: transparent;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
    }

    .popup-close:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fbeee0;
    }

    .popup-fade-enter-active,
    .popup-fade-leave-active {
      transition: opacity .2s ease;
    }

    .popup-fade-enter-active .popup-window,
    .popup-fade-leave-active .popup-window {
      transition: opacity .2s ease, transform .2s ease;
    }

    .popup-fade-enter-from,
    .popup-fade-leave-to {
      opacity: 0;
    }

    .popup-fade-enter-from .popup-window,
    .popup-fade-leave-to .popup-window {
      opacity: 0;
      transform: scale(.94) translateY(6px);
    }

    @media (prefers-reduced-motion: reduce) {

      .popup-fade-enter-active,
      .popup-fade-leave-active,
      .popup-fade-enter-active .popup-window,
      .popup-fade-leave-active .popup-window {
        transition: none;
      }
    }

    .info-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--paper-line);
    }

    .info-panel-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.05em;
    }

    .info-panel-nums {
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
    }

    .pair-card {
      padding: 10px 0;
      border-bottom: 1px dashed var(--paper-line);
    }

    .pair-card:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .pair-card-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brass);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .pair-card-title {
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--cinnabar);
      margin-bottom: 4px;
    }

    .pair-card-rel {
      font-family: var(--font-ui);
      font-weight: 400;
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    .pair-card-desc {
      font-size: 12.5px;
      line-height: 1.75;
      color: var(--ink);
    }

    .pair-card-desc.muted {
      color: var(--ink-soft);
      font-style: italic;
    }

    /* ---------- 五行生剋參考圖（正五邊形排列） ---------- */
    .wuxing-caption {
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brass);
      letter-spacing: 0.1em;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .wuxing-diagram-wrap {
      width: 240px;
      max-width: 62%;
      aspect-ratio: 1 / 1;
      margin: 0 auto 0px;
    }

    .wuxing-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 五行文字：墨色襯線體，呼應九宮格與方位文字的字體 */
    .wx-element {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 對應數字：兩組配色沿用原圖分組，改為靛藍／朱砂紅 */
    .wx-num-indigo {
      font-family: var(--font-ui);
      font-size: 25px;
      font-weight: 700;
      fill: var(--indigo);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .wx-num-cinnabar {
      font-family: var(--font-ui);
      font-size: 25px;
      font-weight: 700;
      fill: var(--cinnabar);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 外圈相生循環箭頭：黃銅色，呼應「滋養、順生」 */
    .wx-cycle-arrow {
      fill: none;
      stroke: var(--brass);
      stroke-width: 2.2;
      stroke-dasharray: 6, 4;
    }

    /* 內圈相剋五角星箭頭：朱砂紅，呼應「制約、相剋」 */
    .wx-ke-arrow {
      fill: none;
      stroke: var(--cinnabar);
      stroke-width: 2.2;
      opacity: .85;
    }

    .wx-marker-brass {
      fill: var(--brass);
    }

    .wx-marker-cinnabar {
      fill: var(--cinnabar);
    }



    /* ---------- 彈出式座山選擇面板 (Popover) 內部元件 ----------
       外層定位已改由 .sitting-popover 負責（見上方「座山選擇」區塊），
       這裡僅保留標題／選項按鈕的樣式，供 .sitting-popover 內容使用。 */

    /* 彈出選單的標題 */
    .popover-title {
      font-family: var(--font-display);
      font-size: 12px;
      /* 標題字體大小 */
      color: var(--paper-deep);
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid #3a3327;
      padding-bottom: 6px;
    }

    /* 彈出選單的按鈕網格佈局 */
    .popover-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      /* 兩欄排版 */
      gap: 6px;
    }

    /* 選擇面板中的方位按鈕 */
    .popover-btn {
      font-family: var(--font-display);
      font-size: 13px;
      /* 按鈕字體大小 */
      padding: 6px 0;
      border-radius: 3px;
      border: 1px solid #3a3327;
      background: #120f0b;
      color: #cbbb96;
      cursor: pointer;
      transition: all .15s ease;
      text-align: center;
    }

    /* 按鈕懸停樣式 */
    .popover-btn:hover {
      border-color: var(--brass);
      color: var(--paper);
    }

    /* 當前已選擇方位的按鈕啟動樣式 */
    .popover-btn.active {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fbeee0;
    }

    /* ---------- 頁尾註腳 ---------- */
    .footnote {
      text-align: center;
      margin-top: 34px;
      font-size: 11.5px;
      /* 註腳字體大小 */
      color: #6b6250;
      letter-spacing: 0.06em;
    }

    /* ---------- 動畫與漸變設定 (Transition) ---------- */
    .fade-swap-enter-active,
    .fade-swap-leave-active {
      transition: opacity .22s ease, transform .22s ease;
    }

    .fade-swap-enter-from {
      opacity: 0;
      transform: scale(.97);
    }

    .fade-swap-leave-to {
      opacity: 0;
      transform: scale(1.02);
    }

    .fade-swap-leave-active {
      position: absolute;
      inset: 0;
    }

    /* 針對不希望看到過度動畫的使用者（系統設定減弱動效） */
    @media (prefers-reduced-motion:reduce) {

      .fade-swap-enter-active,
      .fade-swap-leave-active {
        transition: none;
      }
    }

    /* 行動裝置或小螢幕的響應式樣式調整 */
    @media (max-width:420px) {
      .title {
        font-size: 26px;
        /* 小螢幕下調小主標題字體 */
      }

      .control-row {
        gap: 8px;
      }

      .control-group {
        padding: 5px 6px 5px 10px;
        gap: 6px;
      }

      .control-label {
        font-size: 12px;
      }

      .control-select {
        font-size: 13px;
        padding: 5px 22px 5px 8px;
      }

      .sitting-btn {
        font-size: 14px;
        padding: 7px 14px;
      }
    }
  
    /* ---------- 求真神煞顯示樣式（沿用求真 HTML） ---------- */
    .qz-deities-section { display:grid; grid-template-columns:1fr; gap:20px; margin:25px 0; }
    .qz-deity-card { background:linear-gradient(145deg,#1a1d3c,#15182f); border-radius:12px; padding:20px; border:1px solid #2a2d4c; transition:all .3s ease; }
    .qz-deity-card:hover { transform:translateY(-2px); border-color:#7b68ee; box-shadow:0 6px 12px rgba(123,104,238,.3); }

        _getYearNineStar:function(yearInGanZhi){

          var yearOffset = indexExact - index;
          if (yearOffset > 1) {
            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;
          }
          return NineStar.fromIndex(offset - 1);

            case 3:

              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);

        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);

        getTimeNineStar:function(){

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

            if (!lunarText) {

            const match = lunarText.match(/^(.*?年)(閏?[^月]+月)(.+)$/);
            if (!match) {
                return {year: lunarText, month: '', day: ''};
            }
            return {year: match[1], month: match[2], day: match[3]};
        }

        function parseCell(str) {
            return {
                zhai: str[0],       // 宅：中文（如"一"）
                yun: str[1],        // 運：中文（如"一"）
                nian: parseInt(str[2]) || 1  // 年：阿拉伯數字（如"2"→2）

        function getGanzhiMonthIndex(y, m, d) {

                [807,906],[907,1007],[1008,1106],[1107,1206],[1207,104],[105,203]
            ];
            for(let i=0;i<12;i++){

            }
            return 4;
        }

        // ========================== 新增：檢查日期是否有效 ==========================
        function isValidDate(y, m, d) {
            // 有效日期範圍：2026年2月4日 至 2027年2月3日
            const startDate = new Date(2026, 1, 4); // 月份從0開始，1表示2月
            const endDate = new Date(2027, 1, 3);   // 1表示2月
            const checkDate = new Date(y, m-1, d);
            
            return checkDate >= startDate && checkDate <= endDate;
        }

        function getHourName(hourIndex) {
            const hourNames = ["子時", "丑時", "寅時", "卯時", "辰時", "巳時", "午時", "未時", "申時", "酉時", "戌時", "亥時"];
            return hourNames[hourIndex] || '';
        }

        function getFlyingStarNumber(value) {
            const starNumberMap = {"一":1, "二":2, "三":3, "四":4, "五":5, "六":6, "七":7, "八":8, "九":9};
            if (Number.isFinite(Number(value))) return Number(value);
            const text = String(value ?? '').trim();
            if (starNumberMap[text]) return starNumberMap[text];
            const match = text.match(/[一二三四五六七八九1-9]/);
            if (!match) return null;
            return starNumberMap[match[0]] || Number(match[0]);
        }

        function getFlyingStarToneClass(value) {
            const star = getFlyingStarNumber(value);
            if ([1, 4, 6, 8, 9].includes(star)) return 'flying-star-auspicious';
            if ([2, 3, 5, 7].includes(star)) return 'flying-star-inauspicious';
            return '';
        }

        function getFlyingStarSummary() {
            const year = parseInt(document.getElementById('year-select').value, 10);
            const month = parseInt(document.getElementById('month-select').value, 10);
            const day = parseInt(document.getElementById('day-input').value, 10);
            const hourIndex = parseInt(document.getElementById('hour-select').value, 10);
            const dateKey = String(year) + String(month).padStart(2, '0') + String(day).padStart(2, '0');

            if (!isValidDate(year, month, day)) {
                return {valid: false, reason: 'out-of-range', dateKey};
            }

            const dailyData = dailyFlyingStars[dateKey];
            const hourlyData = hourlyFlyingStars[dateKey];
            if (!dailyData || !hourlyData || hourlyData.length !== 12) {
                return {valid: false, reason: 'missing-purple-data', dateKey};
            }

            return {
                valid: true,
                dateKey,
                year: YEAR_CENTER_STAR,
                month: getYueCenterNum(year, month, day),
                day: dailyData[0],
                hour: hourlyData[hourIndex],
                isReverse: dailyData[1] === 1,
                hourly: hourlyData
            };
        }

        function calculateDailyNumbers(centerNum, isReverse, guas) {
            const order = isReverse ? ['中宮', '巽宮', '震宮', '坤宮', '坎宮', '離宮', '艮宮', '兌宮', '乾宮'] : ['中宮', '乾宮', '兌宮', '艮宮', '離宮', '坎宮', '坤宮', '震宮', '巽宮'];
            const result = [];
            for (let i = 0; i < 9; i++) {
                const palaceName = guas[i] + '宮';
                const index = order.indexOf(palaceName);
                let num = ((centerNum - 1 + index) % 9) + 1;
                result.push(num); // 直接返回阿拉伯數字
            }
            return result;
        }

          "天赦日": {
                    "method": "天赦日依照節氣季節查完整日柱。春季寅月、卯月、辰月逢戊寅日；夏季巳月、午月、未月逢甲午日；秋季申月、酉月、戌月逢戊申日；冬季亥月、子月、丑月逢甲子日，皆為天赦日。",
                    "intro": "天赦日是赦罪、解厄、化解、重新開始的大吉日。它特別適合祈福、懺悔、祭祀、齋醮、解厄、化煞、淨宅、重新啟動等事情，凡是需要解除舊問題、重新開啟的事項，都很適合參考天赦日。"
          },
          "天願日": {
                    "method": "天願日依照節氣月建查完整日柱。寅月逢乙亥日，卯月逢甲戌日，辰月逢乙酉日，巳月逢丙申日，午月逢丁未日，未月逢戊午日，申月逢己巳日，酉月逢庚辰日，戌月逢辛卯日，亥月逢壬寅日，子月逢癸丑日，丑月逢甲子日，皆為天願日。",
                    "intro": "天願日代表願望成就、祈求有應，是祈福求願類很重要的吉日。它適合祭祀、祈福、齋醮、設醮、求願、婚嫁、訂盟、納采、問名、嫁娶，也可以用在開業求成、求財起願等事情上。"

          "歲德": {
                    "method": "歲德依照流年天干查日干。甲年、己年逢甲日；乙年、庚年逢庚日；丙年、辛年逢丙日；丁年、壬年逢壬日；戊年、癸年逢戊日，皆為歲德。",
                    "intro": "歲德是流年之德，代表這一年裡的德氣、正氣與護持力量。它適合大事使用，例如婚嫁、開業、入宅、安宅、修造、動土、祈福、布風水局等，可以讓事情更容易承接當年的正面氣場。"
          },
          "歲德合": {
                    "method": "歲德合依照流年天干查日干。甲年、己年逢己日；乙年、庚年逢乙日；丙年、辛年逢辛日；丁年、壬年逢丁日；戊年、癸年逢癸日，皆為歲德合。",
                    "intro": "歲德合是歲德的合神，代表流年德氣被引動、相合、調順。它適合婚嫁、合作、開業、安宅、祈福、布風水局等事情，特別適合需要人事和合、氣場配合的場合。"
          },
          "年干五合": {
                    "method": "年干五合是看流年天干與當天日干是否形成天干五合。甲年逢己日、乙年逢庚日、丙年逢辛日、丁年逢壬日、戊年逢癸日；己年逢甲日、庚年逢乙日、辛年逢丙日、壬年逢丁日、癸年逢戊日，皆為年干五合。",
                    "intro": "年干五合代表這一天與流年天干相合，有順應流年、合作、承接、關係和合的意思。它適合合作、簽約、婚嫁、訂盟、開業、人際會合等事情，但屬於輔助吉神，不宜單獨決定日子的吉凶。"
          },
          "月干五合": {
                    "method": "月干五合是看節氣月干與當天日干是否形成天干五合。甲月逢己日、乙月逢庚日、丙月逢辛日、丁月逢壬日、戊月逢癸日；己月逢甲日、庚月逢乙日、辛月逢丙日、壬月逢丁日、癸月逢戊日，皆為月干五合。",
                    "intro": "月干五合代表當月氣場與當天日干相合，有和合、配合、順勢而行的意思。它適合婚嫁、訂盟、合作、簽約、開業、交易、人際往來等事情，是一個不錯的輔助加分項。"
          },
          "年支六合": {
                    "method": "年支六合是看流年地支與當天日支是否六合。子與丑合，寅與亥合，卯與戌合，辰與酉合，巳與申合，午與未合。只要流年地支與當天日支成六合，就可標記為年支六合。",
                    "intro": "年支六合代表流年與當天日支相合，主關係和諧、合作順利、人事容易配合。它適合婚嫁、合作、會親友、入宅、開業等事情，但它屬於輔助吉象，不能用來抵消重大凶神。"
          },
          "月支六合": {
                    "method": "月支六合是看節氣月支與當天日支是否六合。寅月逢亥日，卯月逢戌日，辰月逢酉日，巳月逢申日，午月逢未日，未月逢午日，申月逢巳日，酉月逢辰日，戌月逢卯日，亥月逢寅日，子月逢丑日，丑月逢子日，皆為月支六合。",
                    "intro": "月支六合代表當月氣場與當天日支相合，主和合、順暢、配合度高。它適合婚嫁、訂盟、合作、開業、交易、入宅、會親友等事情，是常用的輔助吉神。"
          },
          "三合大局": {
                    "method": "三合大局是看年月日時四個地支中，是否同時出現同一組三合地支的三個不同地支。三合局有四組：亥卯未、寅午戌、巳酉丑、申子辰。只要同一組三個地支齊全，就形成三合大局。",
                    "intro": "三合大局代表氣勢成局、力量完整、事情容易成形。它適合婚嫁、合作、開業、納財、入宅、布風水局、啟動重要計畫等事情，是比半三合更完整、更有力的吉象。"
          },
          "半三合": {
                    "method": "半三合是看年月日時四個地支中，是否出現同一組三合地支裡的兩個不同地支，但沒有三個齊全。例如寅午戌局中，只出現寅和午，或午和戌，就屬於半三合。",
                    "intro": "半三合代表有合作、有引動、有成局的傾向，但力量還沒有完整成形。它可以作為日課加分條件，適合合作、婚嫁、開業、布局等事情，但力量低於三合大局。"
          },
          "歲祿": {
                    "method": "歲祿依照流年天干查當天日支。甲年逢寅日，乙年逢卯日，丙年逢巳日，丁年逢午日，戊年逢巳日，己年逢午日，庚年逢申日，辛年逢酉日，壬年逢亥日，癸年逢子日，皆為歲祿。",

          "月祿": {

                    "intro": "月祿代表當月可用的財祿、資源與助力。它適合開業、求財、納財、交易、談合作、求職升遷等事情，比歲祿更貼近當月氣場，屬於財祿類輔助吉神。"

          "日祿": {

                    "intro": "日祿代表當日自帶祿氣，有財祿、資源、位置、承載力的意思。它適合求財、開業、納財、求官、任職、升遷等事情，但仍需配合整體日課，不宜單獨判定為大吉。"

          "月恩": {

          "天喜日": {

          "民日": {

          "五富": {

                    "intro": "五富代表財富、富足、納財、財物累積。它適合開業、納財、交易、入帳、貨物入庫、財務啟動等事情，是開業求財類很常用的吉神。"

          "母倉": {

          "天倉": {

                    "intro": "天倉代表倉庫、入庫、納財、貨物流轉。它適合納財、入帳、倉儲、庫存、貨物進出、納畜、進人口等事情，尤其適合開業求財中的財貨類操作。"
          },
          "極富星": {
                    "method": "極富星可按月支版查，子月逢辰日，丑月逢巳日，寅月逢午日，卯月逢未日，辰月逢申日，巳月逢酉日，午月逢戌日，未月逢亥日，申月逢子日，酉月逢丑日，戌月逢寅日，亥月逢卯日，皆為極富星。",
                    "intro": "極富星屬於民俗財富星，代表財富累積、資源豐厚、財氣加分。它可用於開業、求財、納財類事項作為輔助參考，力量偏輔助，通常不單獨作為重大事項的主吉依據。"

          "天財星": {
                    "method": "天財星可按月支版查，子月逢巳日，丑月逢午日，寅月逢未日，卯月逢申日，辰月逢酉日，巳月逢戌日，午月逢亥日，未月逢子日，申月逢丑日，酉月逢寅日，戌月逢卯日，亥月逢辰日，皆為天財星。",
                    "intro": "天財星屬於民俗財富星，代表財源、財氣、財運輔助。它適合開業、納財、求財、交易等事情作為輔助加分，力量較輕，不宜單獨作為選日依據，也不能抵消重大凶神。"

          "月驛馬": {
                    "method": "月驛馬依照節氣月建三合局查日支。申月、子月、辰月逢寅日；寅月、午月、戌月逢申日；巳月、酉月、丑月逢亥日；亥月、卯月、未月逢巳日，皆為月驛馬日。",
                    "intro": "月驛馬代表移動、出行、遷移、變動。它適合出行、遠行、搬遷、移徙、入宅、差旅、外出辦事等動態事項，不太適合要求完全安定不動的事情。"

          "歲驛馬": {

                    "intro": "歲驛馬代表流年層面的移動、變化、遠行與遷移。它適合出行、搬遷、遠行、外派、差旅、移徙等事情，但如果用事本身要求安定，則不宜過度取用。"

          "十全富貴日": {

                    "intro": "十全富貴日主要用於陰宅、造葬、安葬、破土、啟攢等喪葬類事項，象徵葬課完整、後人得蔭、富貴綿延。它不是通用吉日，不建議用在婚嫁、開業、入宅等一般事項。"

          "除神": {

          "普護": {

          "福生": {

          "聖心": {

          "益後": {

                    "intro": "益後代表有利後代、延續香火、後續發展。它適合祈福、求嗣、祭祀、延續家運、求子、求後續順利等事情，屬於求嗣與延續類吉神。"

        function getSanHeStatus(branches4) {

                if (appeared.length >= 3) result.push({type: "三合大局", appeared});

        function getRule(rule, stem, branch) {
            if (!rule) return false;
            return rule.type === "stem" ? stem === rule.value : branch === rule.value;

        function parseLunarNumber(text) {
            const map = {"正":1, "一":1, "二":2, "三":3, "四":4, "五":5, "六":6, "七":7, "八":8, "九":9, "十":10, "冬":11, "十一":11, "臘":12, "腊":12, "十二":12};
            if (map[text] !== undefined) return map[text];
            if (/^十[一二]$/.test(text)) return 10 + map[text.charAt(1)];
            return null;
        }

        function parseLunarDayNumber(text) {
            const digits = {"一":1, "二":2, "三":3, "四":4, "五":5, "六":6, "七":7, "八":8, "九":9, "十":10};
            let day = text.replace(/[（）()].*$/, "");
            if (day.startsWith("初")) return digits[day.charAt(1)] || (day.charAt(1) === "十" ? 10 : null);
            if (day === "十") return 10;
            if (day.startsWith("十")) return 10 + (digits[day.charAt(1)] || 0);
            if (day === "二十" || day === "廿") return 20;
            if (day.startsWith("廿")) return 20 + (digits[day.charAt(1)] || 0);
            if (day === "三十" || day === "卅") return 30;
            if (day.startsWith("卅")) return 30 + (digits[day.charAt(1)] || 0);
            return null;
        }

        function getLunarInfo(dateKey, record) {
            const lunar = record?.lunar || "";
            const monthMatch = lunar.match(/(閏?)(正|一|二|三|四|五|六|七|八|九|十|十一|十二|冬|臘|腊)月/);
            const afterMonth = monthMatch ? lunar.slice(monthMatch.index + monthMatch[0].length) : "";
            const dayMatch = afterMonth.match(/(初[一二三四五六七八九十]|十[一二三四五六七八九]?|二十|廿[一二三四五六七八九]?|三十|卅[一二三四五六七八九]?)/);
            const nextKey = addDays(dateKey, 1);
            const nextLunar = calendarDatabase[nextKey]?.lunar || "";
            return {
                month: monthMatch ? parseLunarNumber(monthMatch[2]) : null,
                day: dayMatch ? parseLunarDayNumber(dayMatch[1]) : null,
                isLeapMonth: Boolean(monthMatch?.[1]),
                isLastDay: nextLunar.includes("初一")
            };
        }

        function addDays(dateKey, delta) {
            const parts = dateKey.split("-").map(Number);
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            date.setDate(date.getDate() + delta);
            return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
        }

        function getSolarTermFromLunar(lunarText) {
            const match = lunarText.match(/[（(]([^）)]+)[）)]/);
            if (!match) return "";
            return solarTerms.includes(match[1]) ? match[1] : "";
        }

        function getDateInfo() {
            if (!currentGanzhi) return null;
            const dateKey = getCurrentDateKey();
            const hourIndex = parseInt(document.getElementById("hour-select").value, 10);
            const hourPillar = currentGanzhi.hour?.[hourIndex] || "";
            const lunarInfo = getLunarInfo(dateKey, currentGanzhi);
            const nextKey = addDays(dateKey, 1);
            const nextSolarTerm = getSolarTermFromLunar(calendarDatabase[nextKey]?.lunar || "");

            return {
                dateKey,
                yearStem: currentGanzhi.year.charAt(0),
                yearBranch: currentGanzhi.year.charAt(1),
                monthStem: currentGanzhi.month.charAt(0),
                monthBranch: currentGanzhi.month.charAt(1),
                dayStem: currentGanzhi.day.charAt(0),
                dayBranch: currentGanzhi.day.charAt(1),
                dayPillar: currentGanzhi.day,
                hourPillar,
                hourBranch: hourPillar.charAt(1),

                lunarDay: lunarInfo.day,
                isLunarLastDay: lunarInfo.isLastDay,
                solarTerm: getSolarTermFromLunar(currentGanzhi.lunar),
                nextSolarTerm,
                isDayBeforeSolarTerm: Boolean(nextSolarTerm)
            };
        }

        function getDeityPriority(key, nature) {
            const table = nature === "吉神" ? auspiciousPriority : inauspiciousPriority;
            if (table[key] !== undefined) return table[key];
            const sanheMatch = key.match(/^sanhe-status-(三合大局|半三合)/);
            if (sanheMatch) return table["sanhe-status-" + sanheMatch[1]] ?? 150;
            return 300;

        const deityGradeRank = {A: 0, B: 1, C: 2};

        const dedicatedSceneTags = new Set(["陰宅專用", "婚嫁專用", "安床專用", "女命專用", "亡者年命專用"]);
        const coreDeityNames = new Set(["歲煞", "三合大局", "三合日", "六合日", "天干五合日", "天乙貴人", "命祿", "年干五合", "年支六合"]);
        const coreGoodKeywords = ["通用", "大事", "化凶", "化煞", "重新開始", "順時"];
        const coreBadKeywords = ["通用", "大事忌", "大事慎", "重凶", "破局", "閉塞", "無力", "氣絕", "啟動忌", "開展忌", "災阻", "衝突"];
        const broadKeywords = ["祈福", "和合", "合作", "成局", "布局", "輔助", "清理", "解除", "護佑", "民俗慎用", "不穩"];
        const commonContextKeywords = ["通用", "大事", "合作", "和合", "三煞", "動土", "修造", "風水", "財", "倉儲", "官祿", "資源", "經營", "入宅", "家宅", "出行", "遷移", "求嗣", "人丁", "香火", "民生", "祈福", "開展忌", "人和慎", "啟動慎", "喜事忌"];
        const peachKeywords = ["桃花", "婚戀", "感情", "夫妻宮"];

        function getDeityDisplayMeta(name, nature) {
            const meta = deityDisplayMetadata[name] || {nature: nature?.includes("凶") ? "凶" : "吉", grade: "C", tags: []};
            return Object.assign({name}, meta);
        }

        function getItemDisplayMeta(item) {
            return Object.assign({}, getDeityDisplayMeta(item.name, item.nature), item.displayMeta || {});
        }

        function tagsContainAny(tags, keywords) {
            return tags.some((tag) => keywords.some((keyword) => tag.includes(keyword)));
        }

        function isPeachRelatedMeta(meta) {
            const tags = meta.tags || [];
            if (tagsContainAny(tags, peachKeywords)) return true;
            if (tags.some((tag) => tag === "婚嫁專用" || tag === "女命專用")) return true;
            if (tags.includes("婚嫁") && !tagsContainAny(tags, commonContextKeywords)) return true;
            return false;
        }

        function isFinanceRelatedMeta(meta) {
            return tagsContainAny(meta.tags || [], financeKeywords);
        }

        function isSpecialSceneMeta(meta) {
            const tags = meta.tags || [];
            if (isPeachRelatedMeta(meta)) return true;
            if (tags.includes("安床") || tags.includes("女命")) return true;
            if (tags.includes("婚嫁") && !tagsContainAny(tags, commonContextKeywords)) return true;
            if ((tags.includes("喪葬") || tags.includes("陰宅")) && !tagsContainAny(tags, commonContextKeywords)) return true;
            return false;
        }

        function getDeityScopeRankByMeta(meta) {
            const tags = meta.tags || [];
            if (coreDeityNames.has(meta.name)) return 0;
            if (tags.some((tag) => dedicatedSceneTags.has(tag))) return 3;
            if (isSpecialSceneMeta(meta)) return 2;
            const coreKeywords = meta.nature === "凶" ? coreBadKeywords : coreGoodKeywords;
            if (tagsContainAny(tags, coreKeywords)) return 0;
            if (tagsContainAny(tags, broadKeywords)) return 1;
            return 1;
        }

        function getDeityScopeRank(name, nature) {
            return getDeityScopeRankByMeta(getDeityDisplayMeta(name, nature));
        }

        function getDeityScopeClass(name, nature) {
            return ["core", "broad", "niche", "dedicated"][getDeityScopeRank(name, nature)] || "broad";

        function getDeityScopeClassByMeta(meta) {
            return ["core", "broad", "niche", "dedicated"][getDeityScopeRankByMeta(meta)] || "broad";
        }

        function sortDeitiesForDisplay(items) {
            return [...items].sort((first, second) => {
                const firstMeta = getItemDisplayMeta(first);
                const secondMeta = getItemDisplayMeta(second);
                const firstScope = getDeityScopeRankByMeta(firstMeta);
                const secondScope = getDeityScopeRankByMeta(secondMeta);
                if (firstScope !== secondScope) return firstScope - secondScope;
                if (deityGradeRank[firstMeta.grade] !== deityGradeRank[secondMeta.grade]) return deityGradeRank[firstMeta.grade] - deityGradeRank[secondMeta.grade];
                const firstCoreRank = firstMeta.nature === "吉" ? (auspiciousCoreOrderRank[first.name] ?? 999) : 999;
                const secondCoreRank = secondMeta.nature === "吉" ? (auspiciousCoreOrderRank[second.name] ?? 999) : 999;
                if (firstCoreRank !== secondCoreRank) return firstCoreRank - secondCoreRank;
                const firstBadPairRank = firstMeta.nature === "凶" ? inauspiciousPairOrderRank[first.name] : undefined;
                const secondBadPairRank = secondMeta.nature === "凶" ? inauspiciousPairOrderRank[second.name] : undefined;
                if (firstBadPairRank !== undefined && secondBadPairRank !== undefined && firstBadPairRank !== secondBadPairRank) return firstBadPairRank - secondBadPairRank;
                if ((first.priority ?? 999) !== (second.priority ?? 999)) return (first.priority ?? 999) - (second.priority ?? 999);
                return first.name.localeCompare(second.name, "zh-Hant");
            });
        }

        function getSceneTagColor(tag) {
            if (tag.includes("桃花") || tag.includes("婚戀") || tag.includes("婚嫁") || tag.includes("喜慶") || tag.includes("感情") || tag.includes("夫妻宮")) return "#ff5bc8";
            if (tag.includes("財") || tag.includes("祿") || tag.includes("官祿") || tag.includes("資源") || tag.includes("倉儲") || tag.includes("經營")) return "#ffd166";
            if (tag.includes("入宅") || tag.includes("家宅")) return "#4dd7ff";

            if (tag.includes("祈福") || tag.includes("祭祀") || tag.includes("儀軌") || tag.includes("求願") || tag.includes("護佑")) return "#b995ff";
            if (tag.includes("清理") || tag.includes("解除") || tag.includes("化煞")) return "#62e6d2";
            if (tag.includes("出行") || tag.includes("遷移")) return "#43c4ff";
            if (tag.includes("喪葬") || tag.includes("陰宅")) return "#aeb4c2";
            if (tag.includes("求嗣") || tag.includes("人丁") || tag.includes("香火") || tag.includes("生養") || tag.includes("傳承") || tag.includes("後續")) return "#a7e34d";

            if (tag.includes("和合") || tag.includes("合作")) return "#8bd5ff";
            if (tag.includes("成局") || tag.includes("布局")) return "#f8c967";
            return "#b9c2e4";
        }

        function colorWithAlpha(hex, alpha) {
            const normalized = String(hex).replace("#", "");
            if (!/^[0-9a-fA-F]{6}$/.test(normalized)) return "rgba(148, 163, 184, " + alpha + ")";
            const red = parseInt(normalized.slice(0, 2), 16);
            const green = parseInt(normalized.slice(2, 4), 16);
            const blue = parseInt(normalized.slice(4, 6), 16);
            return "rgba(" + red + ", " + green + ", " + blue + ", " + alpha + ")";
        }

        function mixHexColors(source, target, targetRatio) {
            const cleanSource = String(source).replace("#", "");
            const cleanTarget = String(target).replace("#", "");
            if (!/^[0-9a-fA-F]{6}$/.test(cleanSource) || !/^[0-9a-fA-F]{6}$/.test(cleanTarget)) return source;
            const ratio = Math.max(0, Math.min(1, targetRatio));
            const channel = (start, end) => Math.round(start * (1 - ratio) + end * ratio).toString(16).padStart(2, "0");
            const sr = parseInt(cleanSource.slice(0, 2), 16);
            const sg = parseInt(cleanSource.slice(2, 4), 16);
            const sb = parseInt(cleanSource.slice(4, 6), 16);
            const tr = parseInt(cleanTarget.slice(0, 2), 16);
            const tg = parseInt(cleanTarget.slice(2, 4), 16);
            const tb = parseInt(cleanTarget.slice(4, 6), 16);
            return "#" + channel(sr, tr) + channel(sg, tg) + channel(sb, tb);
        }

        function getDeityAccentColor(meta) {
            const gradeGood = {A:"#20f4a3", B:"#76ddb7", C:"#9abfb3"};
            const gradeBad = {A:"#ff2f55", B:"#ff8a4c", C:"#c7a1aa"};
            const mutedGood = {A:"#8edfc0", B:"#8abfaa", C:"#94a8a1"};
            const mutedBad = {A:"#d86a7d", B:"#c9897d", C:"#a8999f"};
            const peachGood = {A:"#ff5bc8", B:"#e58dce", C:"#bfa3bc"};
            const peachBad = {A:"#e468a6", B:"#c987a6", C:"#a996a2"};
            const financeTone = {A:"#ffd166", B:"#d9b866", C:"#b9ad8b"};
            const tags = meta.tags || [];
            const scopeRank = getDeityScopeRankByMeta(meta);
            if (isPeachRelatedMeta(meta)) return (meta.nature === "凶" ? peachBad : peachGood)[meta.grade] || "#c987a6";
            if (isFinanceRelatedMeta(meta) && !(meta.nature === "凶" && scopeRank === 0)) return financeTone[meta.grade] || "#d9b866";
            if (meta.nature === "凶") return (scopeRank === 0 ? gradeBad : mutedBad)[meta.grade] || "#c9897d";
            const sceneTag = tags.find((tag) => tag !== "通用" && tag !== "命主");
            if (scopeRank === 0) return gradeGood[meta.grade] || "#76ddb7";
            if (scopeRank === 1) return mutedGood[meta.grade] || "#8abfaa";
            if (sceneTag) return mixHexColors(getSceneTagColor(sceneTag), "#9aa6bf", scopeRank === 1 ? 0.32 : 0.46);
            return mutedGood[meta.grade] || "#8abfaa";
        }

        function applyDeityDisplayStyle(button, meta) {
            const accent = getDeityAccentColor(meta);
            const scopeRank = getDeityScopeRankByMeta(meta);

            button.style.setProperty("--deity-accent", accent);
            button.style.setProperty("--deity-bg", colorWithAlpha(accent, alphaMap[meta.grade] || 0.08));
        }

        function escapeDeityHtml(value) {
            const entityByCode = {34:"&quot;", 38:"&amp;", 60:"&lt;", 62:"&gt;"};

        function recordDeity(list, key, name, nature, reason, activities) {
            if (list.some((item) => item.key === key)) return;
            const sameName = list.find((item) => item.name === name && item.nature === nature);
            if (sameName) {
                if (reason && !sameName.reason.includes(reason)) sameName.reason += "；" + reason;
                if (activities && !sameName.activities.includes(activities)) sameName.activities += "；" + activities;
                deityDetailRegistry[name] = deityReferenceDetails[name] || {method: sameName.reason, intro: sameName.activities};
                return;
            }
            list.push({key, name, nature, reason, activities, priority: getDeityPriority(key, nature)});
            deityDetailRegistry[name] = deityReferenceDetails[name] || {method: reason, intro: activities};
        }

        function getYearSanSha(yearBranch, dayBranch) {
            const rule = yearSanShaMap[yearBranch];
            if (!rule) return null;
            if (dayBranch === rule.jie) return "年劫煞";
            if (dayBranch === rule.zai) return "年災煞";
            if (dayBranch === rule.sui) return "歲煞";

            if (dayBranch === rule.zai) return "月災煞";
            if (dayBranch === rule.yue) return "月煞";
            return null;
        }

        const ownerNatalInfoCache = new Map();

        function getOwnerNatalInfo(owner) {
            const profile = ownerProfiles?.["owner" + owner];
            if (!profile?.date || !profile?.time || !profile?.gender) return null;
            const cacheKey = owner + "|" + profile.date + "|" + profile.time + "|" + profile.gender;
            if (ownerNatalInfoCache.has(cacheKey)) return ownerNatalInfoCache.get(cacheKey);
            try {
                const birth = calculateBirthTimeSystem(profile.date, profile.time);
                if (!birth) return null;
                const natalInfo = {
                    owner,
                    gender: profile.gender,
                    yearStem: birth.year.charAt(0),
                    yearBranch: birth.year.charAt(1),
                    monthStem: birth.month.charAt(0),
                    monthBranch: birth.month.charAt(1),
                    lunarYearStem: (birth.lunarYear || birth.year).charAt(0),
                    lunarYearBranch: (birth.lunarYear || birth.year).charAt(1),
                    dayStem: birth.day.charAt(0),
                    dayBranch: birth.day.charAt(1),
                    dayPillar: birth.day,
                    hourStem: birth.hour.charAt(0),
                    hourBranch: birth.hour.charAt(1)
                };
                ownerNatalInfoCache.set(cacheKey, natalInfo);
                return natalInfo;
            } catch (error) {
                return null;
            }
        }

        function stemsOvercomeEachOther(first, second) {
            if (!first || !second || stemCombineMap[first] === second) return false;
            const firstElement = stemElementMap[first];
            const secondElement = stemElementMap[second];
            return elementOvercomesMap[firstElement] === secondElement || elementOvercomesMap[secondElement] === firstElement;
        }

        function getXunKongBranches(dayPillar) {
            let cycleIndex = -1;
            for (let index = 0; index < 60; index += 1) {
                if (stems[index % 10] + branches[index % 12] === dayPillar) {
                    cycleIndex = index;
                    break;
                }
            }
            if (cycleIndex < 0) return [];
            const xunStart = Math.floor(cycleIndex / 10) * 10;
            return [branches[(xunStart + 10) % 12], branches[(xunStart + 11) % 12]];
        }

        function samePersonalSanHeGroup(first, second) {
            return first !== second && sanHeGroups.some((group) => group.includes(first) && group.includes(second));
        }

        function getPersonalSanHeState(natal, info) {
            const natalBranches = [
                {branch: natal.yearBranch, pillar: "year"},
                {branch: natal.monthBranch, pillar: "month"},
                {branch: natal.dayBranch, pillar: "day"},
                {branch: natal.hourBranch, pillar: "hour"}
            ].filter((item) => branches.includes(item.branch));
            const currentBranches = [
                {branch: info.yearBranch, pillar: "year"},
                {branch: info.monthBranch, pillar: "month"},
                {branch: info.dayBranch, pillar: "day"},
                {branch: info.hourBranch, pillar: "hour"}
            ].filter((item) => branches.includes(item.branch));

            const full = sanHeGroups.some(function(group) {
                if (!group.includes(info.dayBranch)) return false;
                const natalInGroup = [...new Set(natalBranches.filter((item) => group.includes(item.branch)).map((item) => item.branch))];
                if (natalInGroup.length === 0) return false;
                if (natalInGroup.length === 1 && natal.yearBranch !== natalInGroup[0]) return false;
                const combined = new Set([
                    ...natalInGroup,
                    ...currentBranches.filter((item) => group.includes(item.branch)).map((item) => item.branch)
                ]);
                return group.every((branch) => combined.has(branch));
            });

            return {
                full,
                half: !full && samePersonalSanHeGroup(natal.yearBranch, info.dayBranch)
            };
        }

        function recordPersonalDeity(list, owner, name, nature, priority, options = {}) {
            const detailKey = "命主" + owner + " · " + name;
            if (list.some((item) => item.detailKey === detailKey)) return;
            list.push({
                key: "personal-owner-" + owner + "-" + name,
                name,
                nature,
                owner,
                personal: true,
                detailKey,
                priority,
                displayMeta: options.displayMeta
            });

        }

        const timeSystemCycles = Object.freeze({
            stems: Object.freeze(['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸']),
            branches: Object.freeze(['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'])
        });
        let ownerProfiles = loadOwnerProfiles();

        function normalizeCycleIndex(index, length) {
            return ((index % length) + length) % length;
        }

        function getCycleItem(items, index) {
            return items[normalizeCycleIndex(index, items.length)];
        }

        function getCivilHourBranch(hour) {
            const branchIndex = Math.floor(((hour + 1) % 24) / 2);
            return getCycleItem(timeSystemCycles.branches, branchIndex);
        }

        function setOwnerTimeResult(owner, result) {
            document.getElementById('owner' + owner + '-lunar-result').textContent = result?.lunar || '請輸入出生日期與時間';
            document.getElementById('owner' + owner + '-year-pillar').textContent = result?.year || '--';
            document.getElementById('owner' + owner + '-month-pillar').textContent = result?.month || '--';
            document.getElementById('owner' + owner + '-day-pillar').textContent = result?.day || '--';
            document.getElementById('owner' + owner + '-hour-pillar').textContent = result?.hour || '--';
        }

        function calculateBirthTimeSystem(dateValue, timeValue) {
            if (!dateValue || !timeValue) return null;
            const dateParts = dateValue.split('-').map(Number);
            const timeParts = timeValue.split(':').map(Number);
            if (dateParts.length !== 3 || timeParts.length < 2 || dateParts.some(Number.isNaN) || timeParts.some(Number.isNaN)) return null;
            if (typeof Solar === 'undefined') throw new Error('農曆時間引擎未載入');

            const solar = Solar.fromYmdHms(dateParts[0], dateParts[1], dateParts[2], timeParts[0], timeParts[1], 0);
            const lunar = solar.getLunar();
            const eightChar = lunar.getEightChar();
            eightChar.setSect(2);
            const result = {
                lunar: lunar.toString(),
                lunarYear: lunar.getYearInGanZhi(),
                year: eightChar.getYear(),
                month: eightChar.getMonth(),
                day: eightChar.getDay(),
                hour: eightChar.getTime()
            };

            const pillars = [result.year, result.month, result.day, result.hour];
            const validPillars = pillars.every(function(pillar) {
                return pillar && timeSystemCycles.stems.includes(pillar.charAt(0)) && timeSystemCycles.branches.includes(pillar.charAt(1));
            });
            if (!validPillars || result.hour.charAt(1) !== getCivilHourBranch(timeParts[0])) {
                throw new Error('干支時間結果校驗失敗');
            }
            return result;
        }

        function applyOpeningDateTime() {
            const now = new Date();
            const displayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const STERM_OFFSET = [0, 21208, 42467, 63836, 85337, 107014, 128867, 150921, 173149, 195551,

    /* ---------------------------------------------------------------

       function generateFlyingStarChart(

    /* 中文數字 <-> 阿拉伯數字對照表 */
    const cnToNum = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
    const numToCn = { 1: "一", 2: "二", 3: "三", 4: "四", 5: "五", 6: "六", 7: "七", 8: "八", 9: "九" };

    /**
     * 將任意整數正規化回 1~9 範圍內（處理超過 9 或小於 1 的情況，形成循環）。
     * @param {number} n
     * @returns {number} 1~9
     */
    function normalizeStar(n) {
      return ((n - 1) % 9 + 9) % 9 + 1;
    }

    /**
     * 建立由 start 開始的九星循環序列（Step 2 / Step 4 共用）。
     * 例如 buildStarCycle(5) => [5,6,7,8,9,1,2,3,4]
     * @param {number} start 1~9
     * @returns {number[]} 長度為 9 的循環序列
     */
    function buildStarCycle(start) {
      const cycle = [];
      for (let i = 0; i < 9; i++) {
        cycle.push(normalizeStar(start + i));
      }
      return cycle;
    }

    /**
     * 飛星共用核心通用函式（大運／流年／未來流月流日流時皆呼叫此函式）。
     * Step1：取得宅命盤中宮星（baseCenterStar）
     * Step2：建立以 baseCenterStar 起始的九星循環（baseCycle）
     * Step3：centerStar 固定入中宮
     * Step4：建立以 centerStar 起始的九星循環（starCycle），
     *        並依「baseCycle[i] 在宅命盤上的原始位置」，
     *        置入「starCycle[i]」，兩序列一一對應。
     *
     * @param {string[][]} baseGrid 宅命盤 3x3（內容為中文數字）
     * @param {number} centerStar 目前入中宮之星（1~9，可為大運星、流年星…）
     * @returns {number[][]} 對應飛星盤 3x3（內容為阿拉伯數字 1~9）
     */
    function generateFlyingStarChart(baseGrid, centerStar) {
      // Step 1：宅命盤中宮星
      const baseCenterStar = cnToNum[baseGrid[1][1]];

      // Step 2：以宅命盤中宮星起始的九星循環
      const baseCycle = buildStarCycle(baseCenterStar);

      // Step 4 使用：以 centerStar 起始的九星循環（Step 3 隱含在此序列的第一項）
      const starCycle = buildStarCycle(centerStar);

      // 建立「數字 -> 宅命盤座標」的對照表，供 Step4 定位使用
      const positionOfStar = {};
      baseGrid.forEach((row, r) => {
        row.forEach((cn, c) => {
          positionOfStar[cnToNum[cn]] = [r, c];
        });
      });

      // 依序將 starCycle[i] 放入「baseCycle[i] 原本所在」的位置
      const resultGrid = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
      baseCycle.forEach((baseVal, i) => {
        const [r, c] = positionOfStar[baseVal];
        resultGrid[r][c] = starCycle[i];
      });

      return resultGrid;
    }

    /**
     * 大運飛星：直接呼叫共用核心，centerStar = 大運入中星。
     * @param {string[][]} baseChart 宅命盤
     * @param {number} periodStar 大運入中星（1~9）
     * @returns {number[][]}
     */
    function generatePeriodChart(baseChart, periodStar) {

    }

    /**
     * 流年飛星：直接呼叫共用核心，centerStar = 流年入中星。
     * 沿用大運飛星的同一套演算法，不另外設計新邏輯。
     * @param {string[][]} baseChart 宅命盤
     * @param {number} annualStar 流年入中星（1~9）
     * @returns {number[][]}
     */
    function generateAnnualChart(baseChart, annualStar) {

    /**
     * 依西元年份取得該年入中星。
     * 對照：2025→2、2026→1、2027→9、2028→8，之後依九星逆序循環。

     * @param {number} year 西元年

    function yearToAnnualStar(year) {
      return normalizeStar(2 - (year - 2025));
    }

    /* 大運選項：一運～九運 */
    const periodOptions = [1, 2, 3, 4, 5, 6, 7, 8, 9];

    /* 流年選項：可切換的年份區間 */
    const currentYear = new Date().getFullYear();
    const yearOptions = Array.from({ length: 9 }, (_, i) => currentYear - 4 + i);

    /* ---------------------------------------------------------------
       星曜組合解釋資料表（來自使用者提供的 star-pair-meanings.json）

    --------------------------------------------------------------- */
    const starPairMeanings =
    {
      "1-1": {

        ],
