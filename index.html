<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紫白飛星九宮圖</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <style>
    /* 全域 CSS 變數：設定主要的配色系統與字體族群，方便統一修改 */
    :root {
      --ink: #2b2620;
      /* 深墨色：用於一般文字及九宮格數字 */
      --ink-soft: #6b5f4d;
      /* 淺墨色：用於次要的說明文字 */
      --paper: #f3ead6;
      /* 紙張底色：網頁與九宮格的主要淺金黃底色 */
      --paper-deep: #e7d9b8;
      /* 深紙色：用於九宮格中心（中宮）的背景色 */
      --paper-line: #cdbb92;
      /* 紙張格線色：九宮格內部的細線顏色 */
      --cinnabar: #d80b0f;
      /* 朱砂紅：用於座山文字、中宮文字、啟用的按鈕等強調色 */
      --cinnabar-deep: #d80b0f;
      /* 深朱砂紅：用於漸層底線或深色朱砂強調 */
      --brass: #b6924f;
      /* 黃銅色：用於外框線與按鈕懸停邊框色 */
      --brass-soft: #d8c290;
      /* 淺黃銅色：用於裝飾性的文字或邊框 */
      --purple: #8a6bb5;
      /* 紫（呼應「紫白飛星」）：用於流年星的強調色，與大運星（朱砂紅）、宅命星（墨色）區隔 */
      --indigo: #5b6bab;
      /* 靛藍：僅用於五行生剋圖中的數字分組配色，與流年紫、大運紅區隔，避免語意混淆 */
      --bg: #14110d;
      /* 網頁主背景色（極深褐色） */
      --bg-vignette: #1d1811;
      /* 網頁主背景的漸層中心色 */
      --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", "STSong", serif;
      /* 標題與飛星數字使用的明體/宋體字型 */
      --font-ui: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 一般 UI 介面與按鈕使用的無襯線字型 */
    }

    /* 基本重設：確保所有元素的外距、內距計算方式一致 */
    * {
      box-sizing: border-box;
    }

    /* 網頁整體版面與背景設定 */
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      /* 徑向漸層背景，營造古典莊嚴的暗色調氛圍 */
      background:
        radial-gradient(ellipse at 50% -10%, var(--bg-vignette) 0%, var(--bg) 60%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 72px;
      /* 網頁四周的間距 */
    }

    /* Vue 掛載點容器 */
    #app {
      width: 100%;
    }

    /* 應用程式主舞台：限制最大寬度並置中 */
    .stage {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
    }

    /* ---------- 上方標題區 ---------- */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    /* 標題上方的小字裝飾 */
    .eyebrow {
      font-family: var(--font-ui);
      font-size: 11px;
      /* 字體大小 */
      letter-spacing: 0.35em;
      /* 字距 */
      color: var(--brass-soft);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* 主標題：紫白飛星九宮圖 */
    .title {
      font-family: var(--font-display);
      font-size: 34px;
      /* 字體大小 */
      font-weight: 600;
      color: var(--paper);
      letter-spacing: 0.14em;
      margin: 0;
    }

    /* 副標題 */
    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      /* 字體大小 */
      color: #a89a7d;
      letter-spacing: 0.08em;
    }

    /* ---------- 羅盤與外圍方位區 ---------- */
    /* 羅盤外圍包裝器：維持 1:1 的正方形比例 */
    .compass-wrap {
      position: relative;
      width: 100%;
      max-width: 660px;
      aspect-ratio: 1/1;
      margin: 0 auto;
    }



    /* 羅盤的網格版面：包含外圍八方位文字與中間的九宮格 */
    .compass-grid {
      position: absolute;
      inset: 2%;
      /* 羅盤網格的向內縮進量，調小以將整體範圍擴大 */
      display: grid;
      /* 網格比例設定：外圍方位寬度佔 0.4fr，中間九宮格放大佔 3.2fr */
      grid-template-columns: 0.4fr 3.2fr 0.4fr;
      grid-template-rows: 0.4fr 3.2fr 0.4fr;
    }

    /* 外圍方位單元格（例如：東、南、西、北等方位文字格） */
    .dir-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: color .25s ease;
    }

    /* 方位單元格的主文字（如「北」） */
    .dir-cell .dir-main {
      font-family: var(--font-display);
      font-size: clamp(20px, 10vw, 18px);
      /* 響應式字體大小 */
      letter-spacing: 0.05em;
      color: #e4d3ab;
    }

    /* 方位單元格的次文字（如「坎水」卦名五行） */
    .dir-cell .dir-sub {
      font-family: var(--font-ui);
      font-size: clamp(12px, 1.6vw, 11px);
      /* 響應式字體大小 */
      letter-spacing: 0.1em;
      color: var(--brass-soft);
      opacity: .85;
    }

    /* 座山方位的特殊強調樣式（顯示為紅色朱砂色） */
    .dir-cell.is-sitting .dir-main {
      color: var(--cinnabar);
      font-weight: 700;
    }

    .dir-cell.is-sitting .dir-sub {
      color: var(--cinnabar);
      opacity: 1;
    }

    /* 向山（朝向）方位的強調樣式（顯示為亮紙色） */
    .dir-cell.is-facing .dir-main {
      color: var(--paper);
      font-weight: 700;
    }

    .dir-cell.is-facing .dir-sub {
      color: var(--paper);
      opacity: .7;
    }

    /* 中間九宮格容器的格線定位 */
    .grid-center {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- 中間九宮格主體 ---------- */
    .nine-grid {
      width: 100%;
      height: 100%;
      aspect-ratio: 1/1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      /* 均分 3 欄 */
      grid-template-rows: repeat(3, 1fr);
      /* 均分 3 列 */
      background: var(--paper);
      border: 1.5px solid var(--brass);
      /* 黃銅色外邊框 */
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .65), inset 0 0 0 1px rgba(0, 0, 0, .04);
      position: relative;
    }

    /* 將紅線融入九宮格底部的座山方向邊框（使用 CSS 偽元素實現漸層紅線） */
    .nine-grid::after {
      content: '';
      position: absolute;
      bottom: -3px;
      /* 貼合在底邊框上 */
      left: -1.5px;
      right: -1.5px;
      height: 8px;
      /* 紅線粗細 */
      background: linear-gradient(90deg, transparent, var(--cinnabar) 15%, var(--cinnabar-deep) 50%, var(--cinnabar) 85%, transparent);
      border-radius: 2px;
      pointer-events: none;
    }

    /* 九宮格單個宮位單元格：同時顯示「流年星」、「大運星」與「宅命星」 */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: 0.5px solid var(--paper-line);
      /* 宮位間的分隔細線 */
      background: var(--paper);
      position: relative;
      aspect-ratio: 1/1;
    }

    .cell-row-header,
    .cell-row-value {
      display: flex;
      justify-content: space-around;
      width: 100%;
      padding: 0 2px;
    }

    .cell-row-header {
      font-family: var(--font-ui);
      font-size: clamp(9px, 1.6vw, 11px);
      color: var(--ink-soft);
      letter-spacing: 0.02em;
    }

    .cell-row-value {
      font-family: var(--font-display);
      font-size: clamp(16px, 3.8vw, 24px);
      font-weight: 700;
    }

    .cell-row-header span,
    .cell-row-value span {
      width: 33%;
      text-align: center;
    }

    .star-red {
      color: var(--cinnabar) !important;
    }

    .star-black {
      color: var(--ink) !important;
    }

    /* 中宮特別強調：底色略深，提示此格為運星入中之處 
    .cell.is-center {
      background: var(--paper-deep);
    }*/

    /* ---------- 大運選擇列 ---------- */
    .period-selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 0 auto 22px;
      max-width: 620px;
    }

    .period-btn {
      font-family: var(--font-display);
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 7px 13px;
      border-radius: 3px;
      border: 1px solid #3a3327;
      background: #1c1812;
      color: #cbbb96;
      cursor: pointer;
      transition: all .18s ease;
    }

    .period-btn:hover {
      border-color: var(--brass);
      color: var(--paper);
    }

    .period-btn.active {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fbeee0;
      box-shadow: 0 0 0 1px rgba(216, 11, 15, 0.35), 0 4px 14px -4px rgba(216, 11, 15, 0.6);
    }

    /* 大運說明文字（例如：九運入中宮） */
    .period-note {
      text-align: center;
      font-size: 12.5px;
      color: var(--brass-soft);
      letter-spacing: 0.08em;
      margin: -12px auto 20px;
    }

    .period-note .accent {
      color: var(--cinnabar);
      font-weight: 700;
    }

    /* ---------- 流年選擇列 ---------- */
    .year-selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 0 auto 8px;
      max-width: 620px;
    }

    .year-btn {
      font-family: var(--font-ui);
      font-size: 13px;
      letter-spacing: 0.03em;
      padding: 6px 11px;
      border-radius: 3px;
      border: 1px solid #3a3327;
      background: #1c1812;
      color: #cbbb96;
      cursor: pointer;
      transition: all .18s ease;
    }

    .year-btn:hover {
      border-color: var(--purple);
      color: var(--paper);
    }

    .year-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #f5eefc;
      box-shadow: 0 0 0 1px rgba(138, 107, 181, 0.35), 0 4px 14px -4px rgba(138, 107, 181, 0.6);
    }

    /* 流年說明文字（例如：2025 → 二入中宮） */
    .year-note {
      text-align: center;
      font-size: 12.5px;
      color: var(--brass-soft);
      letter-spacing: 0.08em;
      margin: 0 auto 20px;
    }

    .year-note .accent-purple {
      color: var(--purple);
      font-weight: 700;
    }

    /* 圖例（三顆星的顏色說明） */
    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin: 18px auto 0;
      font-size: 11.5px;
      color: #a89a7d;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.dot-red {
      background: var(--cinnabar);
    }

    .legend-dot.dot-black {
      background: var(--ink);
    }

    /* 宮位滑鼠移入／點擊選取效果 */
    .cell {
      cursor: pointer;
      transition: background .15s ease, box-shadow .15s ease;
    }

    .cell:hover,
    .cell.is-selected {
      background: #ecdfc0;
      box-shadow: inset 0 0 0 1.5px var(--brass);
    }

    .cell.is-center:hover,
    .cell.is-center.is-selected {
      background: #ddc9a0;
    }

    .cell.is-selected {
      box-shadow: inset 0 0 0 2px var(--cinnabar);
    }

    /* 點擊提示文字 */
    .click-hint {
      text-align: center;
      max-width: 560px;
      margin: 22px auto 0;
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    /* ---------- 宮位資訊彈出視窗（星曜組合解釋） ---------- */
    .popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 5, 0.68);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .popup-window {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 82vh;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--brass);
      border-radius: 6px;
      padding: 24px 24px 18px;
      box-shadow: 0 24px 70px -14px rgba(0, 0, 0, .75);
    }

    .popup-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--paper-line);
      background: transparent;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
    }

    .popup-close:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fbeee0;
    }

    .popup-fade-enter-active,
    .popup-fade-leave-active {
      transition: opacity .2s ease;
    }

    .popup-fade-enter-active .popup-window,
    .popup-fade-leave-active .popup-window {
      transition: opacity .2s ease, transform .2s ease;
    }

    .popup-fade-enter-from,
    .popup-fade-leave-to {
      opacity: 0;
    }

    .popup-fade-enter-from .popup-window,
    .popup-fade-leave-to .popup-window {
      opacity: 0;
      transform: scale(.94) translateY(6px);
    }

    @media (prefers-reduced-motion: reduce) {

      .popup-fade-enter-active,
      .popup-fade-leave-active,
      .popup-fade-enter-active .popup-window,
      .popup-fade-leave-active .popup-window {
        transition: none;
      }
    }

    .info-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--paper-line);
    }

    .info-panel-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.05em;
    }

    .info-panel-nums {
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
    }

    .pair-card {
      padding: 10px 0;
      border-bottom: 1px dashed var(--paper-line);
    }

    .pair-card:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .pair-card-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brass);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .pair-card-title {
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--cinnabar);
      margin-bottom: 4px;
    }

    .pair-card-rel {
      font-family: var(--font-ui);
      font-weight: 400;
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    .pair-card-desc {
      font-size: 12.5px;
      line-height: 1.75;
      color: var(--ink);
    }

    .pair-card-desc.muted {
      color: var(--ink-soft);
      font-style: italic;
    }

    /* ---------- 五行生剋參考圖（正五邊形排列） ---------- */
    .wuxing-caption {
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brass);
      letter-spacing: 0.1em;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .wuxing-diagram-wrap {
      width: 240px;
      max-width: 62%;
      aspect-ratio: 1 / 1;
      margin: 0 auto 0px;
    }

    .wuxing-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 五行文字：墨色襯線體，呼應九宮格與方位文字的字體 */
    .wx-element {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 對應數字：兩組配色沿用原圖分組，改為靛藍／朱砂紅 */
    .wx-num-indigo {
      font-family: var(--font-ui);
      font-size: 25px;
      font-weight: 700;
      fill: var(--indigo);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .wx-num-cinnabar {
      font-family: var(--font-ui);
      font-size: 25px;
      font-weight: 700;
      fill: var(--cinnabar);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 外圈相生循環箭頭：黃銅色，呼應「滋養、順生」 */
    .wx-cycle-arrow {
      fill: none;
      stroke: var(--brass);
      stroke-width: 2.2;
      stroke-dasharray: 6, 4;
    }

    /* 內圈相剋五角星箭頭：朱砂紅，呼應「制約、相剋」 */
    .wx-ke-arrow {
      fill: none;
      stroke: var(--cinnabar);
      stroke-width: 2.2;
      opacity: .85;
    }

    .wx-marker-brass {
      fill: var(--brass);
    }

    .wx-marker-cinnabar {
      fill: var(--cinnabar);
    }



    /* ---------- 互動式座山單元格（下方紅色座山方位） ---------- */
    .dir-cell.is-sitting {
      cursor: pointer;
      /* 滑鼠懸停顯示手型，提示可點擊 */
      position: relative;
      padding: 6px 12px;
      border-radius: 4px;
      background: rgba(163, 39, 42, 0.08);
      /* 淡淡的朱砂紅底色 */
      border: 1px dashed rgba(163, 39, 42, 0.3);
      /* 虛線外框 */
      transition: all .2s ease;
    }

    /* 滑鼠懸停於座山單元格時的視覺回饋 */
    .dir-cell.is-sitting:hover {
      background: rgba(163, 39, 42, 0.15);
      border-color: var(--cinnabar);
      box-shadow: 0 0 8px rgba(163, 39, 42, 0.3);
    }

    /* 結合在座山文字下方的「坐某朝某」字句樣式 */
    .sitting-text-inline {
      margin-top: 4px;
      font-family: var(--font-display);
      font-size: 16px;
      /* 坐朝字體大小 */
      letter-spacing: 0.05em;
      color: var(--cinnabar);
      white-space: nowrap;
      border-top: 1px solid rgba(163, 39, 42, 0.2);
      padding-top: 3px;
    }

    /* ---------- 彈出式座山選擇面板 (Popover) ---------- */
    .popover-selector {
      position: absolute;
      bottom: 115%;
      /* 顯示在座山單元格的上方，避免超出網頁底部 */
      left: 50%;
      transform: translateX(-50%);
      background: #1c1812;
      /* 深色背景 */
      border: 1px solid var(--brass);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
      z-index: 100;
      /* 確保選單顯示在最上層 */
      width: 200px;
      /* 面板寬度 */
      cursor: default;
    }

    /* 彈出選單的標題 */
    .popover-title {
      font-family: var(--font-display);
      font-size: 12px;
      /* 標題字體大小 */
      color: var(--paper-deep);
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid #3a3327;
      padding-bottom: 6px;
    }

    /* 彈出選單的按鈕網格佈局 */
    .popover-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      /* 兩欄排版 */
      gap: 6px;
    }

    /* 選擇面板中的方位按鈕 */
    .popover-btn {

    const cnToNum = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };

     * @param {number} n
     * @returns {number} 1~9
     */
    function normalizeStar(n) {
      return ((n - 1) % 9 + 9) % 9 + 1;
    }

    /**
     * 建立由 start 開始的九星循環序列（Step 2 / Step 4 共用）。
     * 例如 buildStarCycle(5) => [5,6,7,8,9,1,2,3,4]
     * @param {number} start 1~9
     * @returns {number[]} 長度為 9 的循環序列
     */
    function buildStarCycle(start) {
      const cycle = [];
      for (let i = 0; i < 9; i++) {
        cycle.push(normalizeStar(start + i));
      }
      return cycle;
    }

    /**
     * 飛星共用核心通用函式（大運／流年／未來流月流日流時皆呼叫此函式）。

     * Step2：建立以 baseCenterStar 起始的九星循環（baseCycle）
     * Step3：centerStar 固定入中宮
     * Step4：建立以 centerStar 起始的九星循環（starCycle），

     *        置入「starCycle[i]」，兩序列一一對應。
     *
     * @param {string[][]} baseGrid 宅命盤 3x3（內容為中文數字）

     */
    function generateFlyingStarChart(baseGrid, centerStar) {

      const baseCenterStar = cnToNum[baseGrid[1][1]];

      const starCycle = buildStarCycle(centerStar);

      const positionOfStar = {};
      baseGrid.forEach((row, r) => {
        row.forEach((cn, c) => {
          positionOfStar[cnToNum[cn]] = [r, c];
        });
      });

      // 依序將 starCycle[i] 放入「baseCycle[i] 原本所在」的位置
      const resultGrid = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
      baseCycle.forEach((baseVal, i) => {
        const [r, c] = positionOfStar[baseVal];
        resultGrid[r][c] = starCycle[i];
      });

      return resultGrid;

          if ([1, 4, 6, 8, 9].includes(num)) {
            return 'star-red';
          } else if ([2, 3, 5, 7].includes(num)) {
            return 'star-black';

          return '';

            <div class="dir-cell" :class="{ 'is-facing': chart.directions.topLeft === chart.facing }">
              <div class="dir-main">{{ chart.directions.topLeft }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.topLeft] }}</div>
            </div>
            <div class="dir-cell" :class="{ 'is-facing': chart.directions.top === chart.facing }">
              <div class="dir-main">{{ chart.directions.top }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.top] }}</div>
            </div>
            <div class="dir-cell" :class="{ 'is-facing': chart.directions.topRight === chart.facing }">
              <div class="dir-main">{{ chart.directions.topRight }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.topRight] }}</div>
            </div>

            <div class="dir-cell" :class="{ 'is-facing': chart.directions.left === chart.facing }">
              <div class="dir-main">{{ chart.directions.left }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.left] }}</div>
            </div>
            <div class="grid-center">
              <NineGrid :grid="chart.grid" :period-grid="periodGrid" :annual-grid="annualGrid"
                        :selected-cell="selectedCell"
                        @select-cell="onSelectCell" />
            </div>
            <div class="dir-cell" :class="{ 'is-facing': chart.directions.right === chart.facing }">
              <div class="dir-main">{{ chart.directions.right }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.right] }}</div>
            </div>

            <div class="dir-cell" :class="{ 'is-sitting': chart.directions.bottomLeft === chart.sitting }">
              <div class="dir-main">{{ chart.directions.bottomLeft }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.bottomLeft] }}</div>
            </div>
            <div class="dir-cell" :class="{ 'is-sitting': chart.directions.bottom === chart.sitting }" @click="toggleSelector">
              <div class="dir-main">{{ chart.directions.bottom }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.bottom] }}</div>
              <div class="sitting-text-inline">
                坐{{ chart.sitting }}朝{{ chart.facing }}
              </div>
              
              <!-- 彈出式座山選擇器 -->
              <transition name="fade-swap">
                <div v-if="showSelector" class="popover-selector" @click.stop>
                  <div class="popover-title">選擇座山方位</div>
                  <div class="popover-grid">
                    <button v-for="b in selectorButtons" :key="b.key"
                            class="popover-btn" :class="{ active: activeKey === b.key }"
                            @click="select(b.key)">
                      坐{{ b.label }}
                    </button>
                  </div>
                </div>
              </transition>
            </div>
            <div class="dir-cell" :class="{ 'is-sitting': chart.directions.bottomRight === chart.sitting }">
              <div class="dir-main">{{ chart.directions.bottomRight }}</div>
              <div class="dir-sub">{{ baguaMap[chart.directions.bottomRight] }}</div>
            </div>
          </div>
        </transition>
      </div>

  

      <teleport to="body">
        <transition name="popup-fade">
          <div v-if="selectedInfo" class="popup-backdrop" @click.self="closePopup">
            <div class="popup-window">
              <button class="popup-close" @click="closePopup" aria-label="關閉">✕</button>
              <div class="info-panel-head">
                <span class="info-panel-title">{{ selectedInfo.isCenter ? "中宮" : (selectedInfo.direction + "（" + baguaMap[selectedInfo.direction] + "）") }}</span>
                <span class="info-panel-nums">宅 {{ numToCn[selectedInfo.baseNum] }}・運 {{ numToCn[selectedInfo.periodNum] }}・流 {{ selectedInfo.annualNum }}</span>
              </div>

              <div class="wuxing-caption">五行生剋</div>
              <div class="wuxing-diagram-wrap">
                <svg class="wuxing-svg" viewBox="0 0 500 500">
                  <defs>
                    <marker id="wx-arrow-brass" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0,0 L6,3 L0,6 z" class="wx-marker-brass" />
                    </marker>
                    <marker id="wx-arrow-cinnabar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0,0 L6,3 L0,6 z" class="wx-marker-cinnabar" />
                    </marker>
                  </defs>

                  <!-- 外圈相生循環箭頭（木→火→土→金→水→木），以黃銅色呼應「滋養、順生」 -->
                  <path d="M 275 125 A 135 135 0 0 1 355 190" class="wx-cycle-arrow" marker-end="url(#wx-arrow-brass)" />
                  <path d="M 378 235 A 135 135 0 0 1 345 335" class="wx-cycle-arrow" marker-end="url(#wx-arrow-brass)" />
                  <path d="M 310 375 A 135 135 0 0 1 190 375" class="wx-cycle-arrow" marker-end="url(#wx-arrow-brass)" />
                  <path d="M 155 335 A 135 135 0 0 1 122 235" class="wx-cycle-arrow" marker-end="url(#wx-arrow-brass)" />
                  <path d="M 145 190 A 135 135 0 0 1 225 125" class="wx-cycle-arrow" marker-end="url(#wx-arrow-brass)" />

                  <!-- 內圈相剋五角星箭頭（木→土→水→火→金→木），以朱砂紅呼應「制約、相剋」 -->
                  <line x1="258" y1="135" x2="315" y2="335" class="wx-ke-arrow" marker-end="url(#wx-arrow-cinnabar)" />
                  <line x1="305" y1="350" x2="145" y2="225" class="wx-ke-arrow" marker-end="url(#wx-arrow-cinnabar)" />
                  <line x1="145" y1="208" x2="355" y2="208" class="wx-ke-arrow" marker-end="url(#wx-arrow-cinnabar)" />
                  <line x1="355" y1="225" x2="195" y2="350" class="wx-ke-arrow" marker-end="url(#wx-arrow-cinnabar)" />
                  <line x1="185" y1="335" x2="242" y2="135" class="wx-ke-arrow" marker-end="url(#wx-arrow-cinnabar)" />

                  <!-- 五行文字（正五邊形幾何座標，維持正五邊形排列不變） -->
                  <text x="250" y="115" class="wx-element">木</text>
                  <text x="378" y="208" class="wx-element">火</text>
                  <text x="329" y="359" class="wx-element">土</text>
                  <text x="171" y="359" class="wx-element">金</text>
                  <text x="122" y="208" class="wx-element">水</text>

                  <!-- 對應數字（indigo／cinnabar 兩色，沿用原圖分組） -->
                  <text x="220" y="65" class="wx-num-indigo">3</text>
                  <text x="245" y="65" class="wx-num-cinnabar">4</text>

                  <text x="425" y="208" class="wx-num-cinnabar">9</text>

                  <text x="322" y="415" class="wx-num-indigo">2</text>
                  <text x="346" y="415" class="wx-num-indigo">5</text>
                  <text x="372" y="415" class="wx-num-cinnabar">8</text>

                  <text x="125" y="415" class="wx-num-cinnabar">6</text>
                  <text x="145" y="415" class="wx-num-indigo">7</text>

                  <text x="75" y="208" class="wx-num-cinnabar">1</text>
                </svg>
              </div>

              <div class="pair-card" v-for="p in selectedInfo.pairs" :key="p.label">
                <div class="pair-card-label">{{ p.label }}（{{ p.a }}-{{ p.b }}）</div>
                <template v-if="p.data">
                  <div class="pair-card-title">{{ p.data.title }}<span class="pair-card-rel">・{{ p.data.relationship }}</span></div>
                  <div class="pair-card-desc">{{ p.data.description }}</div>
                </template>
                <template v-else>
                  <div class="pair-card-desc muted">此組合尚無對應資料</div>
                </template>
              </div>
            </div>
          </div>
        </transition>
      </teleport>
      <div class="footnote">點擊下方紅色座山方位，即可切換八個不同的座山盤</div>
    </div>
  `
    };

    createApp(FlyingStarChart).mount("#app");
  </script>
</body>

</html>
